name: SAFECheck identity diagnostic
on:
  push:
    branches: [identity-diagnostic-2.15.3]
    paths: ['.github/workflows/identity-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Read existing identity records and verify public Telegram lookup
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          sudo -n docker exec -i safecheck-bot-1 python - <<'IDENTITY_CHECK'
          import asyncio
          import json
          import os
          import runpy
          import sqlite3
          import tempfile
          from pathlib import Path
          from sqlalchemy import or_, select
          from telethon import TelegramClient
          from app.config import Settings
          from app.db import create_database
          from app.models import ScamRecord, User
          from app.mtproto_relay import GroupHelpRelay, private_configuration
          
          async def verify():
              runpy.run_path('/run/configs/secret_entrypoint.py')['load_secrets']()
              settings = Settings()
              engine, sessions = create_database(settings.database_url)
              try:
                  async with sessions() as session:
                      rows = (await session.execute(select(ScamRecord, User).join(User).where(or_(
                          User.username.ilike('%trueva%'),
                          ScamRecord.username_snapshot.ilike('%trueva%'))).order_by(ScamRecord.id))).all()
                      print('IdentityRecords=' + json.dumps([dict(record_id=r.id,
                          status=r.status, user_id=u.telegram_id, username=u.username,
                          snapshot=r.username_snapshot) for r,u in rows]))
                  config = private_configuration(Path(settings.group_help_state_dir))
                  os.umask(0o077)
                  with tempfile.TemporaryDirectory(prefix='safecheck-readonly-identity-') as directory:
                      copied = str(Path(directory) / 'account.session')
                      original = Path(settings.group_help_state_dir) / 'account.session'
                      with sqlite3.connect(f'file:{original}?mode=ro', uri=True) as source:
                          with sqlite3.connect(copied) as destination:
                              source.backup(destination)
                      client = TelegramClient(copied, config['api_id'], config['api_hash'],
                          flood_sleep_threshold=0, request_retries=1, connection_retries=1,
                          timeout=5, receive_updates=False)
                      try:
                          await asyncio.wait_for(client.connect(), 15)
                          assert await client.is_user_authorized()
                          relay = GroupHelpRelay(settings, sessions, client, None)
                          for username in ('brodvejus', 'truevakum'):
                              try:
                                  user = await relay.telegram_user(username)
                                  print('IdentityLookup=' + json.dumps(dict(username=username,
                                      user_id=user.id, current_username=user.username)))
                              except Exception as error:
                                  print('IdentityLookup=' + json.dumps(dict(username=username,
                                      exception_type=type(error).__name__)))
                      finally:
                          await client.disconnect()
              finally:
                  await engine.dispose()
          
          try:
              asyncio.run(verify())
          except Exception as error:
              print('IdentityDiagnosticError=' + type(error).__name__)
              raise SystemExit(1) from None
          IDENTITY_CHECK
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
