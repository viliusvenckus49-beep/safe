name: SAFECheck quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Disposable CI credentials, unrelated to production.
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: |
          compose_test_secrets=$(mktemp -d)
          trap 'rm -rf "$compose_test_secrets"' EXIT
          touch "$compose_test_secrets"/{runtime.env,postgres_password,redis_acl,redis_password,redis_maintenance_password}
          SAFECHECK_ENV_FILE=deploy/runtime.env.example SAFECHECK_SECRETS_DIR="$compose_test_secrets" docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m compileall -q app migrations tests
      - run: DATABASE_URL=sqlite+aiosqlite:////tmp/safecheck-ci.db alembic upgrade head
      - run: DATABASE_URL=sqlite+aiosqlite:////tmp/safecheck-ci.db alembic check
      - run: docker build -t safecheck:ci .
      - name: Start packaged ADS worker without network or runtime secrets
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,size=16m --entrypoint python safecheck:ci - <<'PY'
          import asyncio
          from datetime import UTC, datetime
          from types import SimpleNamespace
          from app.ads_schedule import local_datetime
          from app.bot.ads_publisher import AdsPublisher, ads_worker
          from app.config import Settings
          from app.db import create_database
          from app.models import Base

          async def smoke():
              assert local_datetime('2026-11-20 12:00') == datetime(2026,11,20,10,tzinfo=UTC)
              # Independent connections for the planner/coordinator/dispatch loops.
              # StaticPool in-memory SQLite shares one connection across sessions.
              engine, sessions = create_database('sqlite+aiosqlite:////tmp/ads-smoke.db')
              async with engine.begin() as connection:
                  await connection.run_sync(Base.metadata.create_all)
              completed = asyncio.Event()
              original = AdsPublisher.tick
              async def tick(self):
                  await original(self)
                  completed.set()
              AdsPublisher.tick = tick
              settings = Settings(bot_token='123456:TEST_ONLY', admin_ids='900', _env_file=None)
              task = asyncio.create_task(ads_worker(SimpleNamespace(id=777), settings, sessions))
              try:
                  await asyncio.wait_for(completed.wait(), 10)
              finally:
                  task.cancel()
                  try:
                      await task
                  except asyncio.CancelledError:
                      pass
                  await engine.dispose()
              print('ADS worker startup and shutdown: OK (no Telegram network)')

          asyncio.run(smoke())
          PY
