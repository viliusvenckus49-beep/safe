name: SAFECheck UI Studio encrypted activation
on:
  push:
    branches: [ui-studio-activate-20261009]
    paths: ['.github/workflows/ui-studio-activate.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-ui-studio-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
      - name: Validate UI-only Compose without runtime credentials
        run: |
          env_file=$(mktemp)
          trap 'rm -f "$env_file"' EXIT
          SAFECHECK_TEST_IMAGE=safecheck-ui:ci SAFECHECK_TEST_ENV_FILE="$env_file" docker compose -f docker-compose.test-ui.yml config --quiet
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive and upload tested UI Studio source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ui-studio-source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-ui-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/ui-studio-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-ui-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "tar -xzf \"\$HOME/safecheck-ui-releases/$GITHUB_SHA/source.tar.gz\" -C \"\$HOME/safecheck-ui-releases/$GITHUB_SHA\""
      - name: Decrypt only on VPS and activate isolated UI Studio
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "sudo -n python3 - '$GITHUB_SHA' '$REMOTE_USER'" <<'REMOTE'
          import base64, pwd, subprocess, sys
          from pathlib import Path
          sha = sys.argv[1]
          source = Path(pwd.getpwnam(sys.argv[2]).pw_dir) / 'safecheck-ui-releases' / sha
          key = Path('/etc/safecheck-ui-studio/bootstrap/ui-20261009-befe06a209b0.pem')
          encrypted = base64.b64decode('')
          opened = subprocess.run(['openssl', 'pkeyutl', '-decrypt', '-inkey', str(key), '-pkeyopt', 'rsa_padding_mode:oaep', '-pkeyopt', 'rsa_oaep_md:sha256', '-pkeyopt', 'rsa_mgf1_md:sha256'], input=encrypted, capture_output=True)
          if opened.returncode:
              raise SystemExit('One-use token decryption failed')
          result = subprocess.run([sys.executable, str(source / 'deploy/test_ui_deploy.py'), sha], input=opened.stdout)
          if result.returncode:
              raise SystemExit('UI deployment failed; encrypted handoff retained for retry')
          key.unlink()
          print('UIBootstrapKeyRemoved=true')
          REMOTE
      - name: Remove runner SSH key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
