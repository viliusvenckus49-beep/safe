name: SAFECheck multilingual button promotion
on:
  push:
    branches: [multilang-ui-buttons-20261009]
    paths: ['.github/workflows/multilang-ui-buttons.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: |
          compose_test_secrets=$(mktemp -d)
          trap 'rm -rf "$compose_test_secrets"' EXIT
          touch "$compose_test_secrets"/{runtime.env,postgres_password,redis_acl,redis_password,redis_maintenance_password}
          SAFECHECK_ENV_FILE=deploy/runtime.env.example SAFECHECK_SECRETS_DIR="$compose_test_secrets" docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH access and release archive
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-source.tar.gz"
      - name: Upload and deploy tested source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          counts_sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'observed_members',(SELECT count(*) FROM observed_members),'reports',(SELECT count(*) FROM reports));"
          protected_before=$(sudo -n docker inspect --format '{{.Id}} {{.Image}} {{.State.StartedAt}}' safecheck-postgres-1 safecheck-redis-1 safecheck-ui-studio-studio-1)
          before_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataBefore=%s\n' "$before_counts"
          sudo -n python3 "$release/deploy/github_deploy.py" "$1" </dev/null
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          after_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataAfter=%s\n' "$after_counts"
          python3 -c 'import json,sys; before,after=map(json.loads,sys.argv[1:]); assert all(after[key] >= value for key,value in before.items()), "Preserved data count decreased"; print("Preserved data counts verified.")' "$before_counts" "$after_counts"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'VerifiedService={{.Name}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          protected_after=$(sudo -n docker inspect --format '{{.Id}} {{.Image}} {{.State.StartedAt}}' safecheck-postgres-1 safecheck-redis-1 safecheck-ui-studio-studio-1)
          test "$protected_before" = "$protected_after"
          echo 'DataServicesAndTestBotUnchanged=true'
          REMOTE
      - name: Verify exact promoted buttons and fresh polling
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "sudo -n python3 - safecheck:2.15.4-${GITHUB_SHA:0:12} 38665474bcd2e6323334058641653613d3b9c80c2408acb1a13d63aef11bbc32" <<'PY'
          import ast
          import hashlib
          import json
          import re
          import subprocess
          import sys
          import time
          from datetime import datetime
          
          container = 'safecheck-bot-1'
          
          def run(args):
              result = subprocess.run(args, capture_output=True, timeout=45)
              if result.returncode:
                  raise RuntimeError('Read-only production UI check failed')
              return result.stdout
          
          state = json.loads(run(['docker', 'inspect', '--format', '{{json .State}}', container]))
          image = run(['docker', 'inspect', '--format', '{{.Config.Image}}', container]).decode().strip()
          assert image == sys.argv[1], 'Unexpected production image'
          assert state['Running'] and state['Health']['Status'] == 'healthy', 'Production is not healthy'
          started = datetime.fromisoformat(state['StartedAt'].replace('Z', '+00:00')).timestamp()
          health = json.loads(run(['docker', 'exec', container, 'python', '-c', "import json; from pathlib import Path; print(Path('/tmp/safecheck-health.json').read_text())"]))
          assert health['started_at'] >= started, 'Unexpected health epoch'
          assert health['poll_at'] >= health['started_at'] and time.time() - health['poll_at'] < 180
          assert health['worker_at'] >= health['started_at'] and time.time() - health['worker_at'] < 180
          code = '''
          import ast,json,sysconfig
          from pathlib import Path
          root=Path(sysconfig.get_paths()['purelib'])/'app'
          def catalog(name):
              tree=ast.parse((root/'locales'/name).read_text())
              for node in tree.body:
                  targets=node.targets if isinstance(node,ast.Assign) else [node.target] if isinstance(node,ast.AnnAssign) else []
                  if any(isinstance(t,ast.Name) and t.id=='CATALOGS' for t in targets):
                      return ast.literal_eval(node.value)
              raise RuntimeError('Missing catalog')
          icons={lang:entries for lang,entries in catalog('button_icons.py').items() if entries}
          catalogs=[catalog(name) for name in ('presentation.py','administrators.py')]
          texts={}
          for lang,entries in icons.items():
              merged={k:v for item in catalogs for k,v in item[lang].items()}
              texts[lang]={key:merged[key] for key in entries}
          assert 'icon_fallback=True' in (root/'main.py').read_text()
          assert 'inline_button' in (root/'bot/group_keyboards.py').read_text()
          print(json.dumps({'version':1,'texts':texts,'icons':icons,'layouts':{}},ensure_ascii=False,sort_keys=True,separators=(',',':')))
          '''
          snapshot=json.loads(run(['docker','exec',container,'python','-c',code]))
          encoded=json.dumps(snapshot,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()
          fingerprint=hashlib.sha256(encoded).hexdigest()
          assert fingerprint==sys.argv[2], 'Promoted buttons differ from captured UI Studio design'
          assert sum(map(len,snapshot['icons'].values()))==75
          print('ProductionButtonDesignVerified=75 labels and native icons across LT/EN/RU')
          print('ProductionButtonDesignSHA256='+fingerprint)
          print('ProductionFreshPolling=true')
          print('ProductionFreshWorker=true')
          print('ProductionHealth=healthy')
          logs=subprocess.run(['docker','logs','--tail','250',container],capture_output=True,timeout=30)
          assert logs.returncode==0
          names=re.findall(r'Run polling for bot @([A-Za-z0-9_]+) id=',(logs.stdout+logs.stderr).decode())
          if names:
              print('ProductionBot=https://t.me/'+names[-1])
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
