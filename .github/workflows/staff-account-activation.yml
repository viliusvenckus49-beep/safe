name: SAFECheck switch verified staff account
on:
  push:
    branches: [staff-account-activation-20261009]
    paths: ['.github/workflows/staff-account-activation.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Prepare pinned read-only VPS access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Verify private login and switch only the staff account configuration
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'sudo -n python3 -' <<'PY'
          """Switch only the existing private MTProto account/staff configuration."""
          import importlib.util
          import json
          import os
          import re
          import shutil
          import sqlite3
          import stat
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path
          
          STAFF_ID = -1004430959898
          BOT_ID = 239226622
          SCOPE = {-1003976343267, -1004467894566, -1003987480921, -1004421084692, -1004395482317, -1004413023527, -1003802477695}
          STATE = Path('/etc/safecheck/mtproto-next')
          SELECTOR = Path('/etc/safecheck/compose.env')
          SERVICES = ('safecheck-bot-1', 'safecheck-postgres-1', 'safecheck-redis-1', 'safecheck-ui-studio-studio-1')
          
          
          def run(args, *, text=None, timeout=60):
              result = subprocess.run(args, input=text, capture_output=True, text=True, timeout=timeout)
              if result.returncode:
                  for line in result.stdout.splitlines():
                      if line.startswith('STAFF_VERIFICATION_ERROR='):
                          print(line, flush=True)
                  raise RuntimeError('Command failed: ' + str(result.returncode))
              return result.stdout
          
          
          def setting(content, key):
              values = re.findall(r'^[ \t]*(?:export[ \t]+)?' + re.escape(key) + r'[ \t]*=[ \t]*(.*)$', content, re.M)
              if len(values) != 1:
                  raise ValueError('Missing or duplicate setting: ' + key)
              return values[0].strip().strip('\"\'')
          
          
          def updated(content, values):
              for key, value in values.items():
                  pattern = re.compile(r'^[ \t]*(?:export[ \t]+)?' + re.escape(key) + r'[ \t]*=.*$', re.M)
                  if len(pattern.findall(content)) > 1:
                      raise ValueError('Duplicate setting: ' + key)
                  if pattern.search(content):
                      content = pattern.sub(lambda _: key + '=' + value, content)
                  else:
                      content = content.rstrip('\n') + '\n' + key + '=' + value + '\n'
              return content
          
          
          def service_state(name):
              value = json.loads(run(['docker', 'inspect', '--format', '{{json .State}}', name]))
              return {'id': run(['docker', 'inspect', '--format', '{{.Id}}', name]).strip(),
                      'image': run(['docker', 'inspect', '--format', '{{.Image}}', name]).strip(),
                      'started_at': value['StartedAt'], 'running': value['Running'],
                      'health': value.get('Health', {}).get('Status')}
          
          
          def rows(sql):
              return run(['docker', 'exec', 'safecheck-postgres-1', 'psql', '-U', 'safecheck', '-d', 'safecheck', '-v', 'ON_ERROR_STOP=1', '-Atc', sql]).strip()
          
          
          def counts():
              tables = {'users': 'users', 'rep_events': 'reputation_events', 'rep_requests': 'reputation_requests',
                        'adjustments': 'reputation_adjustments', 'scam_records': 'scam_records', 'trusted': 'trusted_designations',
                        'admins': 'administrators', 'groups': 'managed_groups', 'observed_members': 'observed_members', 'reports': 'reports'}
              sql = 'SELECT json_build_object(' + ','.join("'" + key + "',(SELECT count(*) FROM " + table + ')' for key, table in tables.items()) + ');'
              return json.loads(rows(sql))
          
          
          def health():
              return json.loads(run(['docker', 'exec', 'safecheck-bot-1', 'python', '-c', 'from app.health import snapshot; import json; print(json.dumps(snapshot()))']))
          
          
          def safe_logs(since):
              value = subprocess.run(['docker', 'logs', '--since', str(since), '--tail', '2500', 'safecheck-bot-1'], capture_output=True, text=True, timeout=30)
              result = []
              for line in (value.stdout + value.stderr).splitlines():
                  try:
                      item = json.loads(line)
                  except ValueError:
                      continue
                  if not isinstance(item, dict):
                      continue
                  if item.get('event') in ('group_help_connected', 'group_help_activated', 'group_help_command_submitted', 'group_help_command_failed', 'mtproto_username_lookup_failed', 'update_failed', 'scam_ban_failed') or item.get('level') in ('error', 'critical'):
                      result.append({key: item[key] for key in ('timestamp', 'event', 'level', 'operation', 'exception_type', 'account_id', 'staff_id', 'staff_bot_id', 'user_id', 'chat_id') if key in item})
              return result
          
          
          def main():
              os.umask(0o077)
              print('ACCOUNT_SWITCH_PHASE=preflight', flush=True)
              initial = {name: service_state(name) for name in SERVICES}
              if any(not v['running'] or v['health'] != 'healthy' for v in initial.values()):
                  raise ValueError('Existing services must be healthy before account switch')
              root = Path(run(['docker', 'inspect', '--format', '{{index .Config.Labels "com.docker.compose.project.working_dir"}}', 'safecheck-bot-1']).strip())
              if not root.is_absolute() or not (root / 'docker-compose.production.yml').is_file():
                  raise ValueError('Existing release is unavailable')
              selector_original = SELECTOR.read_text()
              runtime = Path(setting(selector_original, 'SAFECHECK_ENV_FILE'))
              if not runtime.is_absolute() or Path('/etc/safecheck') not in runtime.resolve().parents:
                  raise ValueError('Unexpected runtime configuration path')
              for path in (SELECTOR, runtime):
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != 0 or info.st_mode & 0o077:
                      raise ValueError('Runtime configuration must remain private')
              runtime_original = runtime.read_text()
              configured_scope = {int(value) for value in setting(runtime_original, 'GROUP_HELP_SCOPE_IDS').split(',')}
              if configured_scope != SCOPE or int(setting(runtime_original, 'GROUP_HELP_BOT_ID')) != BOT_ID:
                  raise ValueError('Existing staff scope or pinned bot identity differs')
              sql = "SELECT coalesce(json_agg(json_build_object('chat_id',chat_id,'title',title,'approved',approved,'enabled',enabled)), '[]'::json) FROM managed_groups WHERE chat_id IN (" + ','.join(map(str, sorted(SCOPE))) + ');'
              groups = json.loads(rows(sql))
              if len(groups) != len(SCOPE) or not all(group['approved'] and group['enabled'] for group in groups):
                  raise ValueError('Declared staff scope includes inactive protection')
              info = STATE.lstat()
              if not stat.S_ISDIR(info.st_mode) or info.st_uid != 10001 or info.st_gid != 10001 or info.st_mode & 0o077:
                  raise ValueError('New login directory is not private')
              for name in ('api.json', 'account.session'):
                  info = (STATE / name).lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_uid != 10001 or info.st_gid != 10001 or info.st_mode & 0o077:
                      raise ValueError('New login is missing or is not private')
              print('ACCOUNT_SWITCH_PHASE=authenticate-new-session', flush=True)
              probe = '''import asyncio,json,os
          from pathlib import Path
          from telethon import TelegramClient
          from telethon.tl.functions.contacts import ResolveUsernameRequest
          from mtproto_login import credentials,verify_staff
          async def main():
           os.umask(0o077)
           config=credentials(Path('/state/api.json'))
           client=TelegramClient('/state/account.session',config['api_id'],config['api_hash'],flood_sleep_threshold=0,request_retries=1,connection_retries=2,timeout=5)
           try:
            await asyncio.wait_for(client.connect(),15)
            if not await client.is_user_authorized():raise ValueError('New account session is not authenticated')
            await asyncio.wait_for(verify_staff(client,staff_id=-1004430959898,staff_bot='ghStaffBot'),30)
            me=await client.get_me()
            bot=await client.get_entity('ghStaffBot')
            if bot.id!=239226622:raise ValueError('Pinned staff bot identity differs')
            username=me.username or 'ghStaffBot'
            result=await asyncio.wait_for(client(ResolveUsernameRequest(username)),8)
            user=next((u for u in result.users if u.id==getattr(result.peer,'user_id',None)),None)
            if user is None or user.deleted or (user.username or '').casefold()!=username.casefold():raise ValueError('Current username resolution failed')
            print('STAFF_VERIFICATION='+json.dumps({'account_id':me.id,'staff_id':-1004430959898,'staff_bot_id':bot.id,'username_lookup':'resolved','lookup_username':username,'lookup_user_id':user.id}))
           finally:await client.disconnect()
          try:asyncio.run(main())
          except Exception as error:print('STAFF_VERIFICATION_ERROR='+type(error).__name__);raise SystemExit(1)
          '''
              with tempfile.TemporaryDirectory(prefix='safecheck-session-check-', dir='/etc/safecheck') as directory:
                  copy = Path(directory)
                  shutil.copyfile(STATE / 'api.json', copy / 'api.json')
                  with sqlite3.connect('file:' + str(STATE / 'account.session') + '?mode=ro', uri=True) as source:
                      with sqlite3.connect(copy / 'account.session') as destination:
                          source.backup(destination)
                  os.chown(copy, 10001, 10001)
                  for file in copy.iterdir():
                      file.chmod(0o600)
                      os.chown(file, 10001, 10001)
                  output = run(['docker', 'run', '--rm', '-i', '--read-only', '--tmpfs', '/tmp', '--cap-drop', 'ALL', '--security-opt', 'no-new-privileges', '--user', '10001:10001', '--mount', 'type=bind,src=' + str(copy) + ',dst=/state', '--entrypoint', 'python', 'safecheck-mtproto-tools:1.42.0-staff-switch', '-'], text=probe, timeout=75)
                  lines = [line.removeprefix('STAFF_VERIFICATION=') for line in output.splitlines() if line.startswith('STAFF_VERIFICATION=')]
                  if len(lines) != 1:
                      raise ValueError('New staff verification did not complete')
                  verified = json.loads(lines[0])
                  if verified['staff_id'] != STAFF_ID or verified['staff_bot_id'] != BOT_ID or verified['username_lookup'] != 'resolved':
                      raise ValueError('New staff verification differs')
              print('STAFF_VERIFICATION=' + json.dumps(verified), flush=True)
              print('PROTECTED_STAFF_SCOPE=' + json.dumps(groups), flush=True)
              module_spec = importlib.util.spec_from_file_location('safecheck_ops', root / 'deploy/ops.py')
              module = importlib.util.module_from_spec(module_spec)
              module_spec.loader.exec_module(module)
              args = module.parser().parse_args(['--root', str(root), 'backup'])
              ops = module.Operations(args)
              with ops.lock(maintenance=True):
                  before_counts = counts()
                  print('ACCOUNT_SWITCH_PHASE=verified-backup', flush=True)
                  archive = ops.backup()
                  stamp = time.strftime('%Y%m%dT%H%M%SZ', time.gmtime())
                  for path, original in ((SELECTOR, selector_original), (runtime, runtime_original)):
                      target = path.with_name(path.name + '.before-new-staff-' + stamp)
                      fd = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
                      with os.fdopen(fd, 'w') as file:
                          file.write(original)
                          file.flush()
                          os.fsync(file.fileno())
                  selector_new = updated(selector_original, {'SAFECHECK_MTPROTO_DIR': str(STATE)})
                  runtime_new = updated(runtime_original, {'GROUP_HELP_ENABLED': 'true', 'GROUP_HELP_STAFF_ID': str(STAFF_ID), 'GROUP_HELP_STATE_DIR': '/run/mtproto'})
                  old_compose = json.loads(ops.dc('config', '--format', 'json'))
                  since = int(time.time())
                  print('ACCOUNT_SWITCH_PHASE=activate-new-staff', flush=True)
                  changed = False
                  try:
                      # Stop only the bot before changing its environment and private session mount.
                      changed = True
                      ops.dc('stop', '--timeout', '45', 'bot')
                      module.private_write(SELECTOR, selector_new)
                      module.private_write(runtime, runtime_new)
                      new_compose = json.loads(ops.dc('config', '--format', 'json'))
                      for service in ('postgres', 'redis'):
                          if old_compose['services'][service] != new_compose['services'][service]:
                              raise ValueError('Data service configuration changed')
                      old_bot = dict(old_compose['services']['bot'])
                      new_bot = dict(new_compose['services']['bot'])
                      old_env = dict(old_bot.pop('environment', {}))
                      new_env = dict(new_bot.pop('environment', {}))
                      for key in ('GROUP_HELP_ENABLED', 'GROUP_HELP_STAFF_ID', 'GROUP_HELP_STATE_DIR'):
                          old_env.pop(key, None)
                          new_env.pop(key, None)
                      if old_env != new_env:
                          raise ValueError('Unrelated bot environment differs')
                      old_volumes = old_bot.pop('volumes', [])
                      new_volumes = new_bot.pop('volumes', [])
                      def other_volumes(values):
                          return [v for v in values if v.get('target') != '/run/mtproto']
                      if old_bot != new_bot or other_volumes(old_volumes) != other_volumes(new_volumes):
                          raise ValueError('Unrelated bot configuration differs')
                      if not any(v.get('target') == '/run/mtproto' and v.get('source') == str(STATE) for v in new_volumes):
                          raise ValueError('New private session mount differs')
                      ops.dc('up', '-d', '--no-deps', '--wait', '--wait-timeout', '240', 'bot')
                      current = health()
                      logs = safe_logs(since)
                      connected = [entry for entry in logs if entry.get('event') == 'group_help_connected' and entry.get('account_id') == verified['account_id'] and entry.get('staff_id') == STAFF_ID and entry.get('staff_bot_id') == BOT_ID]
                      if not current.get('healthy') or current.get('poll') is None or current['poll'] > 60 or current.get('worker') is None or current['worker'] > 60 or not connected:
                          raise ValueError('New account runtime connection is not healthy')
                      final = {name: service_state(name) for name in SERVICES}
                      for name in SERVICES[1:]:
                          if final[name] != initial[name]:
                              raise ValueError('A protected data or test service changed')
                      if final['safecheck-bot-1']['image'] != initial['safecheck-bot-1']['image']:
                          raise ValueError('Production bot image changed')
                      after_counts = counts()
                      if not all(after_counts[key] >= value for key, value in before_counts.items()):
                          raise ValueError('Preserved production row count decreased')
                      print('ACCOUNT_SWITCH_COMPLETE=true', flush=True)
                      print('ACCOUNT_SWITCH_BACKUP=' + str(archive), flush=True)
                      print('ACCOUNT_SWITCH_STAFF_ID=' + str(STAFF_ID), flush=True)
                      print('ACCOUNT_SWITCH_STATE=' + str(STATE), flush=True)
                      print('ACCOUNT_SWITCH_ACCOUNT_ID=' + str(verified['account_id']), flush=True)
                      print('ACCOUNT_SWITCH_HEALTH=' + json.dumps(current), flush=True)
                      print('ACCOUNT_SWITCH_DATA_BEFORE=' + json.dumps(before_counts), flush=True)
                      print('ACCOUNT_SWITCH_DATA_AFTER=' + json.dumps(after_counts), flush=True)
                      print('ACCOUNT_SWITCH_EVENTS=' + json.dumps(logs[-30:]), flush=True)
                      print('ACCOUNT_SWITCH_IMAGE_UNCHANGED=true', flush=True)
                      print('ACCOUNT_SWITCH_DATA_SERVICES_UNCHANGED=true', flush=True)
                      print('ACCOUNT_SWITCH_GROUP_COUNT=' + str(len(SCOPE)), flush=True)
                  except Exception:
                      if changed:
                          print('ACCOUNT_SWITCH_EVENTS=' + json.dumps(safe_logs(since)[-20:]), flush=True)
                          module.private_write(SELECTOR, selector_original)
                          module.private_write(runtime, runtime_original)
                          ops.dc('up', '-d', '--no-deps', '--wait', '--wait-timeout', '240', 'bot')
                          print('ACCOUNT_SWITCH_ROLLED_BACK=true', flush=True)
                          print('ACCOUNT_SWITCH_ROLLBACK_HEALTH=' + json.dumps(health()), flush=True)
                      raise
          
          
          try:
              main()
          except Exception as error:
              print('ACCOUNT_SWITCH_ERROR=' + type(error).__name__, flush=True)
              raise SystemExit(1) from None
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
