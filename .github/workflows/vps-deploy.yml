name: SAFECheck VPS deploy
on:
  push:
    branches: [requested-button-style-20261008]
    paths: ['.github/workflows/vps-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: |
          compose_test_secrets=$(mktemp -d)
          trap 'rm -rf "$compose_test_secrets"' EXIT
          touch "$compose_test_secrets"/{runtime.env,postgres_password,redis_acl,redis_password,redis_maintenance_password}
          SAFECHECK_ENV_FILE=deploy/runtime.env.example SAFECHECK_SECRETS_DIR="$compose_test_secrets" docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH access and release archive
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-source.tar.gz"
      - name: Upload and deploy tested source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          counts_sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'observed_members',(SELECT count(*) FROM observed_members),'reports',(SELECT count(*) FROM reports));"
          before_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataBefore=%s\n' "$before_counts"
          sudo -n python3 "$release/deploy/github_deploy.py" "$1" </dev/null
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          after_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataAfter=%s\n' "$after_counts"
          python3 -c 'import json,sys; before,after=map(json.loads,sys.argv[1:]); assert all(after[key] >= value for key,value in before.items()), "Preserved data count decreased"; print("Preserved data counts verified.")' "$before_counts" "$after_counts"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'VerifiedService={{.Name}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec -i safecheck-bot-1 python - <<'BUTTON_CHECK'
          from app.bot import keyboards
          from app.bot.callbacks import AdminAccess
          from app.i18n import t, use_language
          expected = {'lt': [[{'text': '🔍 TIKRINTI', 'callback_data': 'sc|lookup|'}], [{'text': '＋ ĮVERTINTI', 'callback_data': 'sc|rep|'}, {'text': '🚨 PRANEŠTI', 'callback_data': 'sc|report|'}], [{'text': '🏆 TOP 10', 'callback_data': 'sc|top|'}, {'text': '🚷SCAM REGISTRAS', 'callback_data': 'sc|scams|0'}], [{'text': '👤 PROFILIS', 'callback_data': 'sc|profile|'}, {'text': 'ⓘ INFORMACIJA', 'callback_data': 'sc|info|'}], [{'text': '🌐 KALBA', 'callback_data': 'sc|language|'}], [{'text': '↻ GRUPĖS ATKŪRIMAS', 'callback_data': 'sg|subscriptions|0|'}], [{'text': '× UŽDARYTI', 'callback_data': 'sc|close|'}]], 'en': [[{'text': '🔍 CHECK', 'callback_data': 'sc|lookup|'}], [{'text': '＋ RATE', 'callback_data': 'sc|rep|'}, {'text': '🚨 REPORT', 'callback_data': 'sc|report|'}], [{'text': '🏆 TOP 10', 'callback_data': 'sc|top|'}, {'text': '🚷SCAM REGISTRY', 'callback_data': 'sc|scams|0'}], [{'text': '👤 PROFILE', 'callback_data': 'sc|profile|'}, {'text': 'ⓘ INFORMATION', 'callback_data': 'sc|info|'}], [{'text': '🌐 LANGUAGE', 'callback_data': 'sc|language|'}], [{'text': '↻ GROUP RECOVERY', 'callback_data': 'sg|subscriptions|0|'}], [{'text': '× CLOSE', 'callback_data': 'sc|close|'}]], 'ru': [[{'text': '🔍 ПРОВЕРИТЬ', 'callback_data': 'sc|lookup|'}], [{'text': '＋ ОЦЕНИТЬ', 'callback_data': 'sc|rep|'}, {'text': '🚨 СООБЩИТЬ', 'callback_data': 'sc|report|'}], [{'text': '🏆 TOP 10', 'callback_data': 'sc|top|'}, {'text': '🚷РЕЕСТР SCAM', 'callback_data': 'sc|scams|0'}], [{'text': '👤 ПРОФИЛЬ', 'callback_data': 'sc|profile|'}, {'text': 'ⓘ ИНФОРМАЦИЯ', 'callback_data': 'sc|info|'}], [{'text': '🌐 ЯЗЫК', 'callback_data': 'sc|language|'}], [{'text': '↻ ВОССТАНОВЛЕНИЕ ГРУППЫ', 'callback_data': 'sg|subscriptions|0|'}], [{'text': '× ЗАКРЫТЬ', 'callback_data': 'sc|close|'}]]}
          for lang in ('lt', 'en', 'ru'):
              with use_language(lang):
                  actual = [[{'text': b.text, 'callback_data': b.callback_data} for b in row] for row in keyboards.home().inline_keyboard]
                  assert actual == expected[lang], lang
                  assert t('button.admin').startswith('👑 ')
                  for menu in (keyboards.admin(), keyboards.admin(owner=True), keyboards.languages(), keyboards.leaderboard([])):
                      home = [b for row in menu.inline_keyboard for b in row if b.callback_data == keyboards.action('home')]
                      assert len(home) == 1 and home[0].text == t('button.home')
                      assert home[0].text.startswith('◀ ') and '\ufe0f' not in home[0].text
                  ordinary = [b.callback_data for row in keyboards.admin().inline_keyboard for b in row]
                  owned = {b.callback_data: b.text for row in keyboards.admin(owner=True).inline_keyboard for b in row}
                  assert AdminAccess(action='list').pack() not in ordinary
                  assert owned[AdminAccess(action='list').pack()] == t('admin_access.button')
                  assert t('admin_access.button').startswith('👑 ')
                  public = [b.callback_data for row in keyboards.home(private=False).inline_keyboard for b in row]
                  assert keyboards.action('scams', '0') not in public
          print('LiveButtonsVerified=LT,EN,RU symbols/order/callbacks/private-boundaries')
          BUTTON_CHECK
          sudo -n systemctl is-enabled safecheck-monitor.timer
          sudo -n systemctl is-active safecheck-monitor.timer
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
