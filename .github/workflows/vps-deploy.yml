name: SAFECheck VPS deploy
on:
  push:
    branches: ['scam-ban-diagnosis-2.14.0']
    paths: ['.github/workflows/vps-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH access and release archive
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-source.tar.gz"
      - name: Upload and deploy tested source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          counts_sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'observed_members',(SELECT count(*) FROM observed_members),'reports',(SELECT count(*) FROM reports));"
          before_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataBefore=%s\n' "$before_counts"
          sudo -n python3 "$release/deploy/github_deploy.py" "$1" </dev/null
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          after_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataAfter=%s\n' "$after_counts"
          python3 -c 'import json,sys; before,after=map(json.loads,sys.argv[1:]); assert all(after[key] >= value for key,value in before.items()), "Preserved data count decreased"; print("Preserved data counts verified.")' "$before_counts" "$after_counts"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'VerifiedService={{.Name}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec -i safecheck-bot-1 python /run/configs/secret_entrypoint.py python - <<'PYREPAIR'
          import asyncio, json
          from dataclasses import asdict
          from aiogram import Bot
          from sqlalchemy import select, update
          from app.config import Settings
          from app.db import create_database
          from app.models import BanAction, ManagedGroup, now
          from app.group_services import GroupService
          from app.bot.group_runtime import process_scam_bans, _api_reason
          from app.bot.session import telegram_session
          
          TARGET = 5108847812
          FAILED_CHATS = [-1004467894566,-1004421084692,-1004413023527,-1004395482317,-1003987480921]
          async def main():
              settings = Settings(_env_file=None)
              engine, sessions = create_database(settings.database_url)
              bot = Bot(settings.bot_token.get_secret_value(), session=telegram_session(settings))
              try:
                  async with sessions() as session:
                      service = GroupService(settings,session)
                      await service.core.repo.lock_identity_metadata()
                      user = await service.core.repo.user_by_telegram(TARGET)
                      record = await service.core.repo.active_scam(user.id) if user is not None else None
                      if record is None:
                          await session.rollback()
                          print("TargetRemediation=skipped_no_active_scam",flush=True)
                          return
                      record_id=record.id
                      active_chats=select(ManagedGroup.chat_id).where(ManagedGroup.approved.is_(True),ManagedGroup.enabled.is_(True))
                      result=await session.execute(update(BanAction).where(
                          BanAction.telegram_id==TARGET,
                          BanAction.scam_record_id==record_id,
                          BanAction.chat_id.in_(FAILED_CHATS),
                          BanAction.chat_id.in_(active_chats),
                          BanAction.status=="FAILED",
                          BanAction.result_type=="TelegramBadRequest"
                      ).values(status="PENDING",attempts=0,next_attempt_at=now(),completed_at=None,claimed_at=None))
                      await session.commit()
                      print("TargetPendingRequeued="+str(result.rowcount),flush=True)
                  summary=await process_scam_bans(bot,settings,sessions,record_id)
                  print("TargetBanSummary="+json.dumps(asdict(summary)),flush=True)
                  async with sessions() as session:
                      chats=list((await session.scalars(select(ManagedGroup.chat_id).where(ManagedGroup.approved.is_(True),ManagedGroup.enabled.is_(True)))).all())
                  verified=0
                  for chat_id in chats:
                      result={"chat_id":chat_id,"user_id":TARGET}
                      try:
                          member=await asyncio.wait_for(bot.get_chat_member(chat_id,TARGET),8)
                          banned=str(member.status)=="kicked"
                          result.update(status=str(member.status),banned=banned)
                          verified+=banned
                      except Exception as error:
                          result.update(error=type(error).__name__,reason=_api_reason(error) if hasattr(error,"message") else None)
                      print("TargetVerifiedBan="+json.dumps(result),flush=True)
                  print("TargetVerifiedBanCount="+str(verified)+"/"+str(len(chats)),flush=True)
              finally:
                  await bot.session.close()
                  await engine.dispose()
          try:
              asyncio.run(main())
          except Exception as error:
              print("TargetRemediationError="+type(error).__name__,flush=True)
              raise SystemExit(1) from None
          PYREPAIR
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
