name: SAFECheck VPS deploy
on:
  push:
    branches: [scam-ban-diagnosis-2.14.0]
    paths: ['.github/workflows/vps-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: |
          compose_test_secrets=$(mktemp -d)
          trap 'rm -rf "$compose_test_secrets"' EXIT
          touch "$compose_test_secrets"/{runtime.env,postgres_password,redis_acl,redis_password,redis_maintenance_password}
          SAFECHECK_ENV_FILE=deploy/runtime.env.example SAFECHECK_SECRETS_DIR="$compose_test_secrets" docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH access and release archive
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-source.tar.gz"
      - name: Enable verified Crimson Staff session and scope
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' <<'PYSTAFFCONFIG'
          import os,re,stat,tempfile
          from pathlib import Path
          scope=(-1003976343267,-1004467894566,-1003987480921,-1004421084692,-1004395482317,-1004413023527,-1003802477695)
          selector=Path('/etc/safecheck/compose.env')
          text=selector.read_text()
          match=re.search(r'^SAFECHECK_ENV_FILE=[\"\']?([^\"\'\n]+)',text,re.M)
          if not match:raise ValueError('Runtime settings location not configured')
          runtime=Path(match.group(1))
          if not runtime.is_absolute() or Path('/etc/safecheck') not in runtime.resolve().parents:raise ValueError('Unexpected settings location')
          for path in (selector,runtime):
           info=path.lstat()
           if not stat.S_ISREG(info.st_mode) or info.st_uid != 0:raise ValueError('Expected owned regular settings')
          state=Path('/etc/safecheck/mtproto')
          if state.is_symlink() or state.stat().st_uid!=10001 or state.stat().st_mode&0o077:raise ValueError('Session directory is not private')
          for name in ('api.json','account.session'):
           info=(state/name).lstat()
           if not stat.S_ISREG(info.st_mode) or info.st_uid!=10001 or info.st_mode&0o077:raise ValueError('Session file is not private')
          import subprocess
          sql='SELECT count(*) FROM managed_groups WHERE approved AND enabled AND chat_id IN ('+','.join(map(str,scope))+');'
          result=subprocess.run(['docker','exec','safecheck-postgres-1','psql','-U','safecheck','-d','safecheck','-Atc',sql],capture_output=True,check=True)
          if int(result.stdout)!=len(scope):raise ValueError('Staff scope differs from active protection')
          def private_update(path,values):
           content=path.read_text()
           backup=path.with_name(path.name+'.before-mtproto')
           if not backup.exists():
            fd=os.open(backup,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
            with os.fdopen(fd,'w') as f:f.write(content)
           for key,value in values.items():
            pattern=re.compile(r'^[ \t]*(?:export[ \t]+)?'+re.escape(key)+r'[ \t]*=.*$',re.M)
            if len(pattern.findall(content))>1:raise ValueError('Duplicate setting')
            if pattern.search(content):content=pattern.sub(lambda _:key+'='+value,content)
            else:content=content.rstrip('\n')+'\n'+key+'='+value+'\n'
           fd,name=tempfile.mkstemp(dir=path.parent,prefix='.mtproto-settings-')
           with os.fdopen(fd,'w') as f:f.write(content);f.flush();os.fsync(f.fileno())
           os.chmod(name,0o600);os.replace(name,path)
          private_update(selector,{'SAFECHECK_MTPROTO_DIR':str(state)})
          private_update(runtime,{'GROUP_HELP_ENABLED':'true','GROUP_HELP_STAFF_ID':'-1004300060813','GROUP_HELP_BOT_ID':'239226622','GROUP_HELP_SCOPE_IDS':','.join(map(str,scope)),'GROUP_HELP_STATE_DIR':'/run/mtproto'})
          print('PrivateStaffConfigurationReady=true')
          PYSTAFFCONFIG
      - name: Upload and deploy tested source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          counts_sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'observed_members',(SELECT count(*) FROM observed_members),'reports',(SELECT count(*) FROM reports));"
          before_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataBefore=%s\n' "$before_counts"
          sudo -n python3 "$release/deploy/github_deploy.py" "$1" </dev/null
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          after_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataAfter=%s\n' "$after_counts"
          python3 -c 'import json,sys; before,after=map(json.loads,sys.argv[1:]); assert all(after[key] >= value for key,value in before.items()), "Preserved data count decreased"; print("Preserved data counts verified.")' "$before_counts" "$after_counts"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'VerifiedService={{.Name}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
