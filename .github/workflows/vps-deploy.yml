name: SAFECheck VPS deploy
on:
  push:
    branches: [persistent-ask-soft-limits-20261008]
    paths: ['.github/workflows/vps-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: safecheck
          POSTGRES_DB: safecheck_test
          POSTGRES_PASSWORD: ci_only_disposable_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safecheck -d safecheck_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://safecheck:ci_only_disposable_password@localhost:5432/safecheck_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Validate production Compose without reading runtime secrets
        run: |
          compose_test_secrets=$(mktemp -d)
          trap 'rm -rf "$compose_test_secrets"' EXIT
          touch "$compose_test_secrets"/{runtime.env,postgres_password,redis_acl,redis_password,redis_maintenance_password}
          SAFECHECK_ENV_FILE=deploy/runtime.env.example SAFECHECK_SECRETS_DIR="$compose_test_secrets" docker compose --env-file deploy/compose.env.example -f docker-compose.production.yml config --no-env-resolution --quiet
      - run: pytest -q && ruff check . && ruff format --check . && mypy && pip check
  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned SSH access and release archive
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-source.tar.gz"
      - name: Upload and deploy tested source
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $GITHUB_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          counts_sql="SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'observed_members',(SELECT count(*) FROM observed_members),'reports',(SELECT count(*) FROM reports));"
          before_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataBefore=%s\n' "$before_counts"
          sudo -n python3 "$release/deploy/github_deploy.py" "$1" </dev/null
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          after_counts=$(sudo -n docker exec safecheck-postgres-1 psql -U safecheck -d safecheck -Atc "$counts_sql")
          printf 'DataAfter=%s\n' "$after_counts"
          python3 -c 'import json,sys; before,after=map(json.loads,sys.argv[1:]); assert all(after[key] >= value for key,value in before.items()), "Preserved data count decreased"; print("Preserved data counts verified.")' "$before_counts" "$after_counts"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'VerifiedService={{.Name}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec -i safecheck-bot-1 python - <<'ASK_POLICY_CHECK'
          import asyncio
          from types import SimpleNamespace
          from unittest.mock import AsyncMock
          from app.bot import keyboards as kb
          from app.bot.lookup_limits import AskLimiter
          from app.bot.screens import flow_screen, panel_state, preserved_source, render
          from app.i18n import use_language

          async def verify():
              limiter = AskLimiter()
              for target in range(10):
                  assert limiter.admit(1, str(target), 1000) is None
              for second in range(6):
                  assert limiter.admit(1, 'next', 1000 + second) == 'burst'
              assert limiter.admit(1, 'next', 1006) is None
              assert limiter.admit(2, 'next', 1006) is None
              assert limiter.admit(2, 'NEXT', 1015) == 'duplicate'
              assert limiter.admit(2, 'next', 1016) is None
              for lang in ('lt', 'en', 'ru'):
                  with use_language(lang):
                      markup = kb.result('42', persistent=True)
                      values = {b.callback_data for row in markup.inline_keyboard for b in row}
                      assert values == {kb.action('lookup'), kb.action('vote+', '42'), kb.action('vote-', '42'), kb.action('home', 'receipt')}
                      ordinary = kb.result('42')
                      assert kb.action('close') in {b.callback_data for row in ordinary.inline_keyboard for b in row}
                      bot = SimpleNamespace(delete_message=AsyncMock())
                      message = SimpleNamespace(chat=SimpleNamespace(id=1, type='private'), message_id=45, bot=bot, answer=AsyncMock(return_value=SimpleNamespace(message_id=46)))
                      state = SimpleNamespace(get_data=AsyncMock(return_value={'screen_message_id': 44}), update_data=AsyncMock())
                      await flow_screen(message, state, 'result', reply_markup=markup, persistent=True)
                      state.update_data.assert_awaited_with(screen_message_id=None)
                      bot.delete_message.assert_awaited_once_with(1, 44)
                      bot.delete_message.reset_mock()
                      state.get_data.return_value = {'screen_message_id': 47}
                      anchor = panel_state.set(state)
                      source = preserved_source.set(45)
                      try:
                          await render(message, 'next panel', reply_markup=kb.back())
                          bot.delete_message.assert_awaited_once_with(1, 47)
                      finally:
                          preserved_source.reset(source)
                          panel_state.reset(anchor)
                      from app.bot.commands import commands
                      from app.i18n import t
                      assert [c.command for c in commands(lang, group=True)] == ['start', 'ask', 'rep', 'report', 'help']
                      assert commands(lang, group=True)[-1].description == t('command.help')
                      assert 'ⓘ' in t('p.info') and '/ask @username' in t('p.info')
                      print('LiveAskPolicyVerified=' + lang + ' Persistence=passed REPCallbacks=unchanged Back=passed OtherScreens=unchanged')
              print('LiveAskLimitsVerified=Burst10 Refill6s Duplicate10s SilentRejections IndependentUsers ImpatientRetryRecovery')

          asyncio.run(verify())
          ASK_POLICY_CHECK
          systemctl is-enabled safecheck-monitor.timer
          systemctl is-active safecheck-monitor.timer
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
