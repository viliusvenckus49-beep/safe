name: SAFECheck test bot retirement inventory
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n python3 -c 'import json,os,stat,subprocess
          from pathlib import Path
          ROOT=Path('"'"'/home/ubuntu/safecheck-redtrust-mtproto-test-20261020'"'"')
          PREFIX=ROOT.name
          D=['"'"'docker'"'"','"'"'--host=unix:///var/run/docker.sock'"'"']
          def run(args):return subprocess.check_output(args,text=True,timeout=45)
          def emit(name,value):print(name+'"'"'='"'"'+json.dumps(value,ensure_ascii=True,sort_keys=True),flush=True)
          FORMAT='"'"'{"id":{{json .Id}},"name":{{json .Name}},"image":{{json .Config.Image}},"image_id":{{json .Image}},"labels":{{json .Config.Labels}},"state":{{json .State.Status}},"mounts":{{json .Mounts}},"networks":{{json .NetworkSettings.Networks}},"restart":{{json .HostConfig.RestartPolicy}}}'"'"'
          assert os.geteuid()==0
          emit('"'"'Daemon'"'"',run(D+['"'"'info'"'"','"'"'--format'"'"','"'"'{{.ServerVersion}}'"'"']).strip())
          ids=run(D+['"'"'ps'"'"','"'"'-aq'"'"']).split()
          rows=[json.loads(run(D+['"'"'inspect'"'"','"'"'--format'"'"',FORMAT,item])) for item in ids]
          for row in rows:
              name=row['"'"'name'"'"'].lstrip('"'"'/'"'"')
              owned=name.startswith(PREFIX) or any(str(m.get('"'"'Source'"'"','"'"''"'"')).startswith(str(ROOT)+'"'"'/'"'"') or m.get('"'"'Source'"'"')==str(ROOT) for m in row['"'"'mounts'"'"'])
              if owned or name in {'"'"'safecheck-bot-1'"'"','"'"'safecheck-postgres-1'"'"','"'"'safecheck-redis-1'"'"'}:
                  emit('"'"'ContainerInventory'"'"',row)
              else:emit('"'"'OtherContainer'"'"',{'"'"'name'"'"':name,'"'"'image'"'"':row['"'"'image'"'"'],'"'"'state'"'"':row['"'"'state'"'"']})
          if ROOT.exists():
              assert not ROOT.is_symlink() and ROOT.is_dir()
              emit('"'"'TestRoot'"'"',{'"'"'path'"'"':str(ROOT),'"'"'uid'"'"':ROOT.stat().st_uid,'"'"'mode'"'"':oct(stat.S_IMODE(ROOT.stat().st_mode)),'"'"'entries'"'"':[{'"'"'name'"'"':p.name,'"'"'symlink'"'"':p.is_symlink(),'"'"'directory'"'"':p.is_dir()} for p in sorted(ROOT.iterdir())]})
              emit('"'"'TestRootBytes'"'"',run(['"'"'du'"'"','"'"'-sx'"'"','"'"'-B1'"'"',str(ROOT)]).split()[0])
          for name in run(D+['"'"'volume'"'"','"'"'ls'"'"','"'"'-q'"'"']).split():
              if PREFIX in name:emit('"'"'TestVolume'"'"',json.loads(run(D+['"'"'volume'"'"','"'"'inspect'"'"',name]))[0])
          for name in run(D+['"'"'network'"'"','"'"'ls'"'"','"'"'--format'"'"','"'"'{{.Name}}'"'"']).split():
              if PREFIX in name:emit('"'"'TestNetwork'"'"',json.loads(run(D+['"'"'network'"'"','"'"'inspect'"'"',name]))[0])
          markers=(str(ROOT).encode(),PREFIX.encode(),b'"'"'RedTrustBot'"'"',b'"'"'8986848376'"'"')
          for p in sorted(Path('"'"'/home/ubuntu'"'"').glob('"'"'SAFECHECK*'"'"')):
              if p.is_file() and not p.is_symlink():
                  data=p.read_bytes() if p.stat().st_size<8*1024*1024 else b'"'"''"'"'
                  if any(marker in data for marker in markers):
                      emit('"'"'TestHelperCandidate'"'"',{'"'"'path'"'"':str(p),'"'"'bytes'"'"':p.stat().st_size,'"'"'uid'"'"':p.stat().st_uid,'"'"'mode'"'"':oct(stat.S_IMODE(p.stat().st_mode)),'"'"'markers'"'"':[m.decode() for m in markers if m in data]})
          for directory in ('"'"'/etc/systemd/system'"'"','"'"'/etc/cron.d'"'"','"'"'/var/spool/cron/crontabs'"'"'):
              root=Path(directory)
              if root.exists():
                  for p in root.rglob('"'"'*'"'"'):
                      if p.is_file() and not p.is_symlink() and p.stat().st_size<1024*1024:
                          data=p.read_bytes()
                          if any(marker in data for marker in markers[:2]):emit('"'"'AutostartReference'"'"',{'"'"'path'"'"':str(p)})
          for row in run(D+['"'"'stats'"'"','"'"'--no-stream'"'"','"'"'--format'"'"','"'"'{{json .}}'"'"']).splitlines():
              value=json.loads(row)
              emit('"'"'ContainerResources'"'"',{k:value.get(k) for k in ('"'"'Name'"'"','"'"'MemUsage'"'"','"'"'MemPerc'"'"','"'"'CPUPerc'"'"')})
          emit('"'"'HostMemory'"'"',{l.split('"'"':'"'"')[0]:int(l.split()[1])*1024 for l in Path('"'"'/proc/meminfo'"'"').read_text().splitlines() if l.startswith(('"'"'MemTotal:'"'"','"'"'MemAvailable:'"'"','"'"'SwapTotal:'"'"','"'"'SwapFree:'"'"'))})'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
