name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, cutover, verify, lookup-only, verify-lookup, lookup-config, ads-rights, ads-release, ads-verify]
        default: inspect
      source_sha:
        default: ''
      validated_run_id:
        default: ''
      stage_id:
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Wait for completed exact-source AUTO ADS quality checks
        if: ${{ inputs.operation == 'ads-release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.validated_run_id }}
        run: |
          set -eu
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]
          for attempt in $(seq 1 180); do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/ads-ci.json"
            status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/ads-ci.json")
            if [ "$status" = completed ]; then
              python3 deploy/verified_ci.py "$RUNNER_TEMP/ads-ci.json" "$GITHUB_REPOSITORY" fix/auto-ads-owner-rights-20261112 "$SOURCE_SHA"
              break
            fi
            test "$attempt" -lt 180
            sleep 10
          done
      - uses: actions/checkout@v4
        if: ${{ inputs.operation == 'ads-release' }}
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Read prepared identity and outstanding work
        if: ${{ inputs.operation == 'inspect' || inputs.operation == '' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' < deploy/identity_startup_report.py
      - name: Verify live identity and the seven confirmed groups
        if: ${{ inputs.operation == 'verify' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' < deploy/identity_postcheck.py
      - name: Disable account staff transport and preserve ID lookup
        if: ${{ inputs.operation == 'lookup-only' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' < deploy/disable_staff_transport.py
      - name: Verify public ID lookup without staff messages
        if: ${{ inputs.operation == 'verify-lookup' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' < deploy/verify_lookup_only.py
      - name: Verify lookup-only configuration before release
        if: ${{ inputs.operation == 'lookup-config' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 - --config-only' < deploy/verify_lookup_only.py
      - name: Read live AUTO ADS authorization and Telegram roles
        if: ${{ inputs.operation == 'ads-rights' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'sudo -n python3 -' < deploy/auto_ads_rights_audit.py
      - name: Release the verified AUTO ADS owner authorization fix
        if: ${{ inputs.operation == 'ads-release' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          git -C candidate archive --format=tar.gz HEAD > "$RUNNER_TEMP/ads-owner-source.tar.gz"
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$SOURCE_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/ads-owner-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$SOURCE_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $SOURCE_SHA" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          sudo -n python3 "$release/deploy/production_release.py" "$1" </dev/null
          REMOTE
      - name: Verify owner access with real bot rights and unchanged audiences
        if: ${{ inputs.operation == 'ads-release' || inputs.operation == 'ads-verify' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -eu
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" "sudo -n python3 - $SOURCE_SHA" < deploy/verify_ads_owner.py
      - name: Verify completed full CI for immutable application source
        if: ${{ inputs.operation == 'cutover' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ID: ${{ inputs.validated_run_id }}
          STAGE_ID: ${{ inputs.stage_id }}
        run: |
          set -eu
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]
          [[ "$STAGE_ID" =~ ^[a-f0-9]{32}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > "$RUNNER_TEMP/identity-ci.json"
          python3 deploy/verified_ci.py "$RUNNER_TEMP/identity-ci.json" "$GITHUB_REPOSITORY" fix/bot-owner-replacement-20261102 "$SOURCE_SHA"
      - uses: actions/checkout@v4
        if: ${{ inputs.operation == 'cutover' }}
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          persist-credentials: false
      - name: Upload tested source and execute guarded identity cutover
        if: ${{ inputs.operation == 'cutover' }}
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          STAGE_ID: ${{ inputs.stage_id }}
        run: |
          set -eu
          git -C candidate archive --format=tar.gz HEAD > "$RUNNER_TEMP/identity-source.tar.gz"
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-releases/$SOURCE_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/identity-source.tar.gz" "$REMOTE_USER@$HOST:safecheck-releases/$SOURCE_SHA/source.tar.gz"
          scp "${SSH_OPTIONS[@]}" deploy/rotate_prepared_identity.py "$REMOTE_USER@$HOST:safecheck-releases/identity-operator-$SOURCE_SHA.py"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "bash -se -- $SOURCE_SHA $STAGE_ID" <<'REMOTE'
          set -eu
          release="$HOME/safecheck-releases/$1"
          tar -xzf "$release/source.tar.gz" -C "$release"
          sudo -n python3 "$HOME/safecheck-releases/identity-operator-$1.py" "$release" "$1" "$2"
          sudo -n docker inspect safecheck-bot-1 safecheck-postgres-1 safecheck-redis-1 --format 'IdentityVerifiedService={{.Name}} Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
