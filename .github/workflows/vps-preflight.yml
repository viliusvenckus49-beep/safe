name: SAFECheck VPS preflight
on:
  push:
    branches: [scam-ban-diagnosis-2.14.0]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Install isolated MTProto login tool without activating automation
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'install -d -m 700 "$HOME/safecheck-mtproto-tools" "$HOME/.config/safecheck-mtproto"'
          scp "${SSH_OPTIONS[@]}" deploy/mtproto_login.py deploy/mtproto-tools.Dockerfile "$REMOTE_USER@$HOST:safecheck-mtproto-tools/"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker build -f "$HOME/safecheck-mtproto-tools/mtproto-tools.Dockerfile" -t safecheck-mtproto-tools:1.42.0 "$HOME/safecheck-mtproto-tools"
          sudo -n docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --entrypoint python safecheck-mtproto-tools:1.42.0 -c 'import telethon; assert telethon.__version__ == "1.42.0"; print("MTProtoToolsReady=" + telethon.__version__)'
          sudo -n docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges safecheck-mtproto-tools:1.42.0 --help
          sudo -n docker run --rm -i --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --mount "type=bind,src=$HOME/.config/safecheck-mtproto-account2,dst=/state" --entrypoint python safecheck-mtproto-tools:1.42.0 - <<'PYVERIFY'
          import asyncio,json
          from telethon import TelegramClient
          from mtproto_login import verify_staff
          async def main():
           with open('/state/api.json') as handle:config=json.load(handle)
           client=TelegramClient('/state/account.session',config['api_id'],config['api_hash'],flood_sleep_threshold=0)
           try:
            await client.connect()
            if not await client.is_user_authorized():raise ValueError('Account not authenticated')
            await verify_staff(client)
           finally:await client.disconnect()
          try:asyncio.run(main())
          except Exception as error:print('StaffVerificationError='+type(error).__name__);raise SystemExit(1)
          PYVERIFY
          REMOTE
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Root={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Compose={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          sudo -n test -f /etc/safecheck/compose.env && echo ComposeEnvironment=present
          sudo -n docker inspect safecheck-postgres-1 --format 'PostgresHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-redis-1 --format 'RedisHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-postgres-1 --format '{{range .Mounts}}PostgresMount={{.Type}} {{.Destination}}{{println}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          df -h /home/ubuntu
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
