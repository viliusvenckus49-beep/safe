name: SAFECheck command-menu deployment verification
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
    inputs:
      phase:
        description: preflight or verify
        required: true
        default: preflight
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Verify production identity, service health and command menus
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          PHASE: ${{ inputs.phase }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" "bash -se -- $PHASE" <<'REMOTE'
          set -eu
          sudo -n python3 -c 'import json,subprocess,sys,shutil
          D=['"'"'docker'"'"','"'"'--host=unix:///var/run/docker.sock'"'"']
          phase=sys.argv[1];assert phase in ('"'"'preflight'"'"','"'"'verify'"'"')
          def run(a):return subprocess.check_output(a,text=True,timeout=120)
          def emit(k,v):print(k+'"'"'='"'"'+json.dumps(v,sort_keys=True),flush=True)
          fmt='"'"'{"name":{{json .Name}},"id":{{json .Id}},"image":{{json .Config.Image}},"started":{{json .State.StartedAt}},"running":{{json .State.Running}}}'"'"'
          for cid in run(D+['"'"'ps'"'"','"'"'-aq'"'"']).split():emit('"'"'ContainerInventory'"'"',json.loads(run(D+['"'"'inspect'"'"','"'"'--format'"'"',fmt,cid])))
          for name in ('"'"'safecheck-bot-1'"'"','"'"'safecheck-postgres-1'"'"','"'"'safecheck-redis-1'"'"'):
           value=run(D+['"'"'inspect'"'"','"'"'--format'"'"','"'"'{{.State.Health.Status}}'"'"',name]).strip();emit('"'"'ServiceHealth'"'"',{'"'"'name'"'"':name,'"'"'health'"'"':value});assert value=='"'"'healthy'"'"'
          image=run(D+['"'"'inspect'"'"','"'"'--format'"'"','"'"'{{.Config.Image}}'"'"','"'"'safecheck-bot-1'"'"']).strip()
          expected='"'"'safecheck:2.15.4-'"'"'+('"'"'088ff2c52166'"'"' if phase=='"'"'preflight'"'"' else '"'"'b7178198f45a'"'"');assert image==expected
          emit('"'"'ExpectedImageVerified'"'"',image)
          emit('"'"'DiskUsage'"'"',dict(zip(('"'"'total'"'"','"'"'used'"'"','"'"'free'"'"'),shutil.disk_usage('"'"'/home/ubuntu'"'"'))))
          if phase=='"'"'verify'"'"':
           emit('"'"'SourceHashes'"'"',run(D+['"'"'exec'"'"','"'"'safecheck-bot-1'"'"','"'"'python'"'"','"'"'-c'"'"',"import json,hashlib;from pathlib import Path;expected={'"'"'app/bot/commands.py'"'"': '"'"'ef4968d5ec624f3e61eb970adb425a8414d2fe859d55823b421ad856705e3979'"'"', '"'"'app/bot/handlers.py'"'"': '"'"'50adc5950cb06bdc464e94e5dd90e3387893cc9171bc88a96e261d63eb667ad0'"'"'};actual={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in expected};print(json.dumps(actual,sort_keys=True));assert actual==expected"]).strip())
           emit('"'"'BotRuntimeHealth'"'"',run(D+['"'"'exec'"'"','"'"'safecheck-bot-1'"'"','"'"'python'"'"','"'"'/run/configs/secret_entrypoint.py'"'"','"'"'python'"'"','"'"'-c'"'"','"'"'import json;from app.health import snapshot;s=snapshot();print(json.dumps(s,sort_keys=True));assert s["healthy"]'"'"']).strip())
           emit('"'"'CommandMenuProbe'"'"',run(D+['"'"'exec'"'"','"'"'safecheck-bot-1'"'"','"'"'python'"'"','"'"'/run/configs/secret_entrypoint.py'"'"','"'"'python'"'"','"'"'-c'"'"',"import asyncio,json\nfrom aiogram import Bot\nfrom aiogram.types import BotCommandScopeDefault,BotCommandScopeAllPrivateChats,BotCommandScopeAllGroupChats,BotCommandScopeAllChatAdministrators,BotCommandScopeChat\nfrom app.config import Settings\nfrom app.bot.session import telegram_session\nasync def main():\n s=Settings();b=Bot(s.bot_token.get_secret_value(),session=telegram_session(s))\n hidden={'"'"'rep'"'"','"'"'ban'"'"','"'"'unban'"'"','"'"'warn'"'"','"'"'unwarn'"'"','"'"'mute'"'"','"'"'unmute'"'"','"'"'warns'"'"','"'"'kick'"'"','"'"'moderation'"'"'}\n try:\n  me=await b.get_me();assert me.id==8403154035 and me.username.lower()=='"'"'redsafecheckbot'"'"'\n  print('"'"'VerifiedBot='"'"'+me.username,flush=True)\n  for scope in (BotCommandScopeDefault(),BotCommandScopeAllPrivateChats(),BotCommandScopeAllGroupChats(),BotCommandScopeAllChatAdministrators()):\n   for lang in (None,'"'"'lt'"'"','"'"'en'"'"','"'"'ru'"'"'):\n    rows=await b.get_my_commands(scope=scope,language_code=lang);names=[r.command for r in rows]\n    print('"'"'TelegramMenu='"'"'+json.dumps({'"'"'scope'"'"':scope.type,'"'"'language'"'"':lang,'"'"'commands'"'"':names}),flush=True)\n    assert not hidden.intersection(names)\n    if scope.type!='"'"'all_private_chats'"'"':assert names==(['"'"'start'"'"','"'"'ask'"'"','"'"'report'"'"','"'"'help'"'"'] if scope.type in ('"'"'all_group_chats'"'"','"'"'all_chat_administrators'"'"') else ['"'"'start'"'"','"'"'ask'"'"','"'"'report'"'"'])\n  for actor in s.admins:\n   rows=await b.get_my_commands(scope=BotCommandScopeChat(chat_id=actor))\n   assert [r.command for r in rows]==['"'"'start'"'"','"'"'ask'"'"','"'"'report'"'"']\n  print('"'"'TelegramCommandMenus=PASS; AdminPrivateScopes='"'"'+str(len(s.admins)),flush=True)\n finally:await b.session.close()\ntry:asyncio.run(asyncio.wait_for(main(),90))\nexcept Exception as error:\n print('"'"'TelegramCommandProbeError='"'"'+type(error).__name__,flush=True)\n raise SystemExit(1)\n"]).strip())' "$1"
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
