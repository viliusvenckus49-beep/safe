name: SAFECheck VPS preflight
on:
  push:
    branches: [scam-ban-diagnosis-2.14.0]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Root={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Compose={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          sudo -n test -f /etc/safecheck/compose.env && echo ComposeEnvironment=present
          sudo -n docker inspect safecheck-postgres-1 --format 'PostgresHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-redis-1 --format 'RedisHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-postgres-1 --format '{{range .Mounts}}PostgresMount={{.Type}} {{.Destination}}{{println}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          sudo -n docker run --rm -i --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user "$(id -u):$(id -g)" --mount "type=bind,src=$HOME/.config/safecheck-mtproto-account2,dst=/state" --entrypoint python safecheck-mtproto-tools:1.42.0 - <<'PYSTAFF'
          import asyncio,json
          from telethon import TelegramClient
          from telethon import utils
          async def main():
           with open('/state/api.json') as handle:
            config=json.load(handle)
           client=TelegramClient('/state/account.session',config['api_id'],config['api_hash'],flood_sleep_threshold=0)
           try:
            await client.connect()
            if not await client.is_user_authorized():
             print('AccountAuthorized=false');return
            me=await client.get_me()
            print('AccountAuthorized=true')
            print('AccountID='+str(me.id))
            bot=await client.get_entity('ghStaffBot')
            if not getattr(bot,'bot',False) or (getattr(bot,'username','') or '').lower()!='ghstaffbot':
             print('StaffBotVerified=false');return
            print('StaffBotVerified=true')
            count=0
            async for dialog in client.iter_dialogs():
             if not dialog.is_group or 'staff' not in (dialog.title or '').casefold():continue
             count+=1
             result={'id':utils.get_peer_id(dialog.entity),'title':dialog.title,'group_type':type(dialog.entity).__name__}
             try:
              participants=await client.get_participants(dialog.entity)
              result['staff_bot_present']=any(u.id==bot.id for u in participants)
             except Exception as error:result['membership_check_error']=type(error).__name__
             print('StaffCandidate='+json.dumps(result,ensure_ascii=False))
            print('StaffCandidateCount='+str(count))
           finally:await client.disconnect()
          try:asyncio.run(main())
          except Exception as error:print('StaffDiagnosticError='+type(error).__name__);raise SystemExit(1)
          PYSTAFF
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
