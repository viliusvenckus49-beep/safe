name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import json
          import asyncpg
          from app.config import Settings
          from app.health import snapshot
          
          def emit(name, value):
              print(name + "=" + json.dumps(value, default=str, sort_keys=True))
          
          async def main():
              state = snapshot()
              emit("RuntimeHeartbeat", state)
              if not state["healthy"]:
                  raise RuntimeError("Runtime heartbeat unhealthy")
              settings = Settings()
              db = await asyncpg.connect(settings.database_url.replace("postgresql+asyncpg:", "postgresql:"))
              try:
                  async with db.transaction(readonly=True, isolation="repeatable_read"):
                      schema = await db.fetchval("SELECT version_num FROM alembic_version")
                      emit("WarningSchema", schema)
                      if schema != "0021":
                          raise RuntimeError("Expected warning settings schema")
                      rows = await db.fetch("SELECT chat_id,warning_limit,warning_action,warning_mute_seconds,warning_version FROM group_moderation_settings ORDER BY chat_id")
                      emit("WarningPolicies", [dict(row) for row in rows])
                      invalid = await db.fetchval("SELECT count(*) FROM group_moderation_settings WHERE warning_limit NOT BETWEEN 2 AND 6 OR warning_action NOT IN ('"'"'OFF'"'"','"'"'KICK'"'"','"'"'MUTE'"'"','"'"'BAN'"'"') OR warning_mute_seconds NOT BETWEEN 60 AND 31536000 OR warning_version<1")
                      emit("InvalidWarningPolicies", invalid)
                      if invalid:
                          raise RuntimeError("Invalid warning policy")
              finally:
                  await db.close()
          
          try:
              asyncio.run(main())
          except Exception as error:
              emit("ReadOnlyWarningVerificationFailed", {"type": type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
