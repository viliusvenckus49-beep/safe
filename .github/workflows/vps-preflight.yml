name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import json
          import re
          import asyncpg
          from app.config import Settings
          
          
          def emit(name, value):
              print(name + '"'"'='"'"' + json.dumps(value, default=str, sort_keys=True))
          
          
          def safe_error(value):
              if value is None:
                  return None
              return value if re.fullmatch(r'"'"'[A-Za-z_][A-Za-z0-9_]{0,79}'"'"', value) else '"'"'DETAILS_WITHHELD'"'"'
          
          
          async def main():
              db = await asyncpg.connect(Settings().database_url.replace('"'"'postgresql+asyncpg:'"'"', '"'"'postgresql:'"'"'))
              try:
                  async with db.transaction(readonly=True, isolation='"'"'repeatable_read'"'"'):
                      row = await db.fetchrow('"'"''"'"''"'"'SELECT a.id,a.schedule_id,a.content_version_id,a.chat_id,a.schedule_version,a.due_at,a.status,a.fence,a.lease_until,a.retry_at,a.error,a.notified,a.created_at,a.completed_at,s.campaign_id,s.status AS schedule_status,s.version AS current_schedule_version,s.next_run_at,s.updated_at AS schedule_updated_at,c.internal_name,g.title AS group_title FROM ad_publication_attempts a JOIN ad_schedules s ON s.id=a.schedule_id JOIN ad_campaigns c ON c.id=s.campaign_id LEFT JOIN managed_groups g ON g.chat_id=a.chat_id WHERE a.id=79'"'"''"'"''"'"')
                      if row is None:
                          emit('"'"'Attempt79'"'"', None)
                          return
                      data = dict(row)
                      data['"'"'error'"'"'] = safe_error(data['"'"'error'"'"'])
                      emit('"'"'Attempt79'"'"', data)
                      parts = await db.fetch('"'"'SELECT id,position,kind,status,message_ids,tries,error FROM ad_publication_parts WHERE attempt_id=79 ORDER BY position'"'"')
                      values = []
                      for part in parts:
                          value = dict(part)
                          value['"'"'error'"'"'] = safe_error(value['"'"'error'"'"'])
                          values.append(value)
                      emit('"'"'Attempt79Parts'"'"', values)
                      audit = await db.fetch("SELECT id,action,created_at,details FROM audit_events WHERE action LIKE '"'"'ads_publication_%'"'"' AND details->>'"'"'attempt_id'"'"'='"'"'79'"'"' ORDER BY id")
                      values = []
                      keys = {'"'"'campaign_id'"'"','"'"'attempt_id'"'"','"'"'schedule_id'"'"','"'"'chat_id'"'"','"'"'content_version_id'"'"','"'"'fence'"'"','"'"'part_id'"'"','"'"'position'"'"','"'"'status'"'"','"'"'message_ids'"'"'}
                      for entry in audit:
                          value = dict(entry)
                          details = value.pop('"'"'details'"'"')
                          if isinstance(details, str):
                              details = json.loads(details)
                          value['"'"'details'"'"'] = {k: v for k, v in details.items() if k in keys}
                          value['"'"'error'"'"'] = safe_error(details.get('"'"'error'"'"'))
                          values.append(value)
                      emit('"'"'Attempt79Audit'"'"', values)
              finally:
                  await db.close()
          
          try:
              asyncio.run(main())
          except Exception as error:
              emit('"'"'ReadOnlyAttemptInspectionFailed'"'"', {'"'"'type'"'"': type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
