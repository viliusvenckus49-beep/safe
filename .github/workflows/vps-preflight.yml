name: SAFECheck authorized pranashas audience repair
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Repair authorized ad 2 audience and resume only future Klaipeda slots
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio,json
          from sqlalchemy import select
          from aiogram import Bot
          from app.config import Settings
          from app.db import create_database
          from app.bot.session import telegram_session
          from app.ads_unified import UnifiedAds
          from app.ads_publication import PublicationService
          from app.models import AdCampaign,AdSchedule,AdPublicationAttempt,ManagedGroup,now
          
          def emit(name,value):
              print(name+'"'"'='"'"'+json.dumps(value,default=str,ensure_ascii=True))
          
          async def main():
              settings=Settings()
              engine,sessions=create_database(settings.database_url)
              try:
                  async with Bot(settings.bot_token.get_secret_value(),session=telegram_session(settings)) as bot:
                      async with sessions() as session:
                          actor=settings.group_owner
                          assert actor and bot.id==8403154035
                          ad=await session.get(AdCampaign,2)
                          assert ad.internal_name.lower()=='"'"'pranashas'"'"' and ad.status=='"'"'DRAFT'"'"'
                          management=UnifiedAds(settings,session)
                          policy=await management.policy(actor,2)
                          rows=await management.schedules(2)
                          selected=[]; withdrawn=[]
                          for row in rows:
                              if row.excluded or not row.chat_id:continue
                              group=await session.get(ManagedGroup,row.chat_id)
                              if group and group.approved and group.enabled:
                                  selected.append(row.chat_id)
                              else:
                                  withdrawn.append(row.chat_id)
                          assert set(withdrawn).issubset({-1004398786973,-1003985132354})
                          assert -1004395482317 in selected
                          emit('"'"'AudienceRepairPlan'"'"',{'"'"'campaign_id'"'"':2,'"'"'withdraw'"'"':sorted(withdrawn),'"'"'keep'"'"':sorted(selected)})
                          if withdrawn:
                              await management.groups(actor,2,policy.version,selected,bot,all_groups=policy.mode=='"'"'EXISTING'"'"')
                          row=await session.get(AdSchedule,5,populate_existing=True)
                          assert row.campaign_id==2 and row.chat_id==-1004395482317 and not row.excluded
                          live=list(await session.scalars(select(AdPublicationAttempt.id).where(
                              AdPublicationAttempt.schedule_id==5,
                              AdPublicationAttempt.status.in_(['"'"'CLAIMED'"'"','"'"'SENDING'"'"','"'"'UNCERTAIN'"'"']))))
                          assert not live, '"'"'Unresolved delivery evidence requires review; no resumption performed'"'"'
                          if row.status=='"'"'PAUSED'"'"':
                              assert row.last_error=='"'"'TelegramNetworkError'"'"'
                              pub=PublicationService(settings,session,schedule_id=5)
                              row=await pub.activate(actor,2,row.version,ad.version,bot)
                              assert row.next_run_at and row.next_run_at>now()
                              emit('"'"'KlaipedaResumed'"'"',{'"'"'schedule_id'"'"':5,'"'"'status'"'"':row.status,'"'"'next_run_at'"'"':row.next_run_at,'"'"'old_deliveries_retried'"'"':False})
                          else:
                              assert row.status=='"'"'ACTIVE'"'"'
                              emit('"'"'KlaipedaAlreadyActive'"'"',{'"'"'schedule_id'"'"':5,'"'"'next_run_at'"'"':row.next_run_at})
                          rows=await management.schedules(2)
                          emit('"'"'AudienceAfter'"'"',[{'"'"'schedule_id'"'"':r.id,'"'"'chat_id'"'"':r.chat_id,'"'"'status'"'"':r.status,'"'"'excluded'"'"':r.excluded,'"'"'next_run_at'"'"':r.next_run_at} for r in rows])
              finally:
                  await engine.dispose()
          asyncio.run(main())'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
