name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import json
          import asyncpg
          from app.config import Settings
          from app.health import snapshot
          
          def emit(name,value):
              print(name+'"'"'='"'"'+json.dumps(value,default=str,sort_keys=True))
          
          async def main():
              from app.bot.commands import LOCAL_COMMANDS
              from app.bot.group_help import register_group_help
              assert '"'"'warns'"'"' in LOCAL_COMMANDS and '"'"'warnings'"'"' not in LOCAL_COMMANDS
              assert callable(register_group_help)
              emit('"'"'GroupHelpRuntime'"'"',{'"'"'group_first'"'"':True,'"'"'warning_history_command'"'"':'"'"'warns'"'"'})
              state=snapshot()
              emit('"'"'RuntimeHeartbeat'"'"',state)
              if not state['"'"'healthy'"'"']:
                  raise RuntimeError('"'"'Runtime unhealthy'"'"')
              db=await asyncpg.connect(Settings().database_url.replace('"'"'postgresql+asyncpg:'"'"','"'"'postgresql:'"'"'))
              try:
                  async with db.transaction(readonly=True,isolation='"'"'repeatable_read'"'"'):
                      revision=await db.fetchval('"'"'SELECT version_num FROM alembic_version'"'"')
                      emit('"'"'ChecksSchema'"'"',revision)
                      if revision!='"'"'0023'"'"':
                          raise RuntimeError('"'"'Expected Checks schema'"'"')
                      rows=await db.fetch('"'"'SELECT chat_id,version,actions,check_on_join,delete_messages,notify_result,mute_seconds,words_action,words_delete,json_array_length(banned_words) AS banned_word_count FROM group_check_settings ORDER BY chat_id'"'"')
                      emit('"'"'ChecksPolicies'"'"',[dict(r) for r in rows])
                      states=await db.fetch('"'"'SELECT state,count(*) AS count FROM group_check_events GROUP BY state ORDER BY state'"'"')
                      emit('"'"'ChecksEvents'"'"',[dict(r) for r in states])
                      invalid=await db.fetchval("SELECT count(*) FROM group_check_events e JOIN group_sanction_jobs j ON j.sanction_id=e.sanction_id WHERE j.operation='"'"'APPLY'"'"' AND (e.notice_message_id IS NULL OR e.notice_sent_at IS NULL OR e.execute_after IS NULL OR e.execute_after<e.notice_sent_at+make_interval(secs=>e.grace_seconds) OR e.grace_seconds<>CASE WHEN e.kick_attempt>=4 THEN 0 WHEN e.kick_attempt>=2 THEN 5 ELSE 15 END OR j.created_at<e.execute_after)")
                      emit('"'"'EarlyOrUnannouncedCheckActions'"'"',invalid)
                      if invalid:
                          raise RuntimeError('"'"'Notice grace invariant failed'"'"')
                      policies=await db.fetch('"'"'SELECT chat_id,warning_limit,warning_action,warning_mute_seconds,warning_version FROM group_moderation_settings ORDER BY chat_id'"'"')
                      emit('"'"'WarningPolicies'"'"',[dict(r) for r in policies])
              finally:
                  await db.close()
          try:
              asyncio.run(main())
          except Exception as error:
              emit('"'"'ReadOnlyChecksVerificationFailed'"'"',{'"'"'type'"'"':type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
