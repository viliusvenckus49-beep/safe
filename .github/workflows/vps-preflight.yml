name: SAFECheck ad group read-only diagnostics
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio,json
          import asyncpg
          from aiogram import Bot
          from app.config import Settings
          from app.bot.session import telegram_session
          
          def emit(name,value):
              print(name+'"'"'='"'"'+json.dumps(value,default=str,ensure_ascii=True))
          
          async def main():
              settings=Settings()
              db=await asyncpg.connect(settings.database_url.replace('"'"'postgresql+asyncpg:'"'"','"'"'postgresql:'"'"'))
              try:
                  async with db.transaction(readonly=True,isolation='"'"'repeatable_read'"'"'):
                      groups=await db.fetch("SELECT g.*, EXISTS(SELECT 1 FROM audit_events a WHERE a.action='"'"'group_removed'"'"' AND (a.details->>'"'"'chat_id'"'"')::bigint=g.chat_id) AS removed_history FROM managed_groups g ORDER BY g.chat_id")
                      emit('"'"'Groups'"'"',[dict(r) for r in groups])
                      emit('"'"'Campaigns'"'"',[dict(r) for r in await db.fetch("SELECT c.id,c.internal_name,c.status,c.version,c.client_telegram_id,c.created_at,c.updated_at,p.mode,p.auto_activate,p.interval_seconds,p.start_at,p.end_at,p.last_error, EXISTS(SELECT 1 FROM ad_content_versions v WHERE v.campaign_id=c.id AND v.content::text ILIKE '"'"'%pranashas%'"'"') AS mentions_pranashas FROM ad_campaigns c LEFT JOIN ad_assignment_policies p ON p.campaign_id=c.id ORDER BY c.id DESC LIMIT 30")])
                      schedules=await db.fetch('"'"'SELECT id,campaign_id,chat_id,status,excluded,interval_seconds,start_at,end_at,next_run_at,last_dispatched_at,last_error,authorized_by,updated_at FROM ad_schedules ORDER BY campaign_id,id'"'"')
                      emit('"'"'Schedules'"'"',[dict(r) for r in schedules])
                      emit('"'"'RecentPublicationResults'"'"',[dict(r) for r in await db.fetch('"'"'SELECT a.id,s.campaign_id,a.schedule_id,a.chat_id,a.status,a.error,a.due_at,a.completed_at FROM ad_publication_attempts a JOIN ad_schedules s ON s.id=a.schedule_id ORDER BY a.id DESC LIMIT 20'"'"')])
                      emit('"'"'GroupChangeAudit'"'"',[dict(r) for r in await db.fetch("SELECT id,actor_id,action,details->>'"'"'chat_id'"'"' AS chat_id,details->>'"'"'enabled'"'"' AS enabled,created_at FROM audit_events WHERE action IN ('"'"'group_removed'"'"','"'"'group_registered'"'"','"'"'group_staged'"'"','"'"'group_approved'"'"','"'"'group_disabled'"'"','"'"'group_enabled'"'"') ORDER BY id DESC LIMIT 25")])
                  async with Bot(settings.bot_token.get_secret_value(),session=telegram_session(settings)) as bot:
                      ids=sorted({r['"'"'chat_id'"'"'] for r in schedules if r['"'"'chat_id'"'"'] and not r['"'"'excluded'"'"']})
                      for chat in ids:
                          try:
                              member=await asyncio.wait_for(bot.get_chat_member(chat,bot.id),8)
                              emit('"'"'BotGroupRights'"'"',{'"'"'chat_id'"'"':chat,'"'"'status'"'"':member.status,'"'"'can_post_messages'"'"':getattr(member,'"'"'can_post_messages'"'"',None),'"'"'can_manage_chat'"'"':getattr(member,'"'"'can_manage_chat'"'"',None)})
                          except Exception as error:
                              emit('"'"'BotGroupRights'"'"',{'"'"'chat_id'"'"':chat,'"'"'error_type'"'"':type(error).__name__,'"'"'message'"'"':getattr(error,'"'"'message'"'"','"'"''"'"')[:160]})
              finally:
                  await db.close()
          asyncio.run(main())'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
