name: SAFECheck navigation read-only verification
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import importlib.util
          import json
          import asyncpg
          from app.config import Settings
          from app.health import snapshot
          
          
          def emit(name,value):
              print(name+'"'"'='"'"'+json.dumps(value,sort_keys=True,default=str))
          
          
          async def main():
              healthy=snapshot()
              emit('"'"'RuntimeHeartbeat'"'"',healthy)
              if not healthy['"'"'healthy'"'"']:
                  raise RuntimeError('"'"'Unhealthy runtime'"'"')
              upgraded=importlib.util.find_spec('"'"'app.bot.admin_navigation'"'"') is not None
              if upgraded:
                  from app.bot import keyboards,states
                  from app.group_services import GroupService
                  from app.i18n import CATALOGS,use_language
                  from app.locales.button_icons import CATALOGS as icons
                  for lang in ('"'"'lt'"'"','"'"'en'"'"','"'"'ru'"'"'):
                      assert '"'"'command.recovery'"'"' not in CATALOGS[lang]
                      with use_language(lang):
                          buttons=[b for row in keyboards.home(True,owner=True).inline_keyboard for b in row]
                          assert all(b.icon_custom_emoji_id is None for b in buttons)
                          assert all(len(b.callback_data.encode())<=64 for b in buttons)
                          assert not any(b.callback_data.startswith('"'"'sg|'"'"') for b in buttons)
                          assert icons[lang]=={}
                  assert not hasattr(states,'"'"'RecoveryFlow'"'"')
                  assert not any(hasattr(GroupService,name) for name in ('"'"'queue_recovery'"'"','"'"'subscribe'"'"','"'"'export_members'"'"','"'"'claim_deliveries'"'"'))
                  emit('"'"'NavigationStage2Runtime'"'"',{'"'"'state'"'"':'"'"'AFTER'"'"','"'"'unicode_labels'"'"':True,'"'"'legacy_recovery_runtime_removed'"'"':True,'"'"'locales'"'"':['"'"'lt'"'"','"'"'en'"'"','"'"'ru'"'"']})
              else:
                  emit('"'"'NavigationStage2Runtime'"'"',{'"'"'state'"'"':'"'"'BEFORE'"'"'})
              db=await asyncpg.connect(Settings().database_url.replace('"'"'postgresql+asyncpg:'"'"','"'"'postgresql:'"'"'))
              try:
                  async with db.transaction(readonly=True,isolation='"'"'repeatable_read'"'"'):
                      schema=await db.fetchval('"'"'SELECT version_num FROM alembic_version'"'"')
                      emit('"'"'Schema'"'"',schema)
                      assert schema=='"'"'0023'"'"'
                      for name,table,condition in (
                          ('"'"'UnfinishedNativeJobs'"'"','"'"'group_sanction_jobs'"'"',"status IN ('"'"'PENDING'"'"','"'"'PROCESSING'"'"','"'"'UNCERTAIN'"'"')"),
                          ('"'"'UnfinishedNativeSanctions'"'"','"'"'group_sanctions'"'"',"status IN ('"'"'PENDING'"'"','"'"'REVOKING'"'"','"'"'UNCERTAIN'"'"')"),
                          ('"'"'UnfinishedAds'"'"','"'"'ad_publication_attempts'"'"',"status IN ('"'"'CLAIMED'"'"','"'"'SENDING'"'"','"'"'UNCERTAIN'"'"')"),
                          ('"'"'UnfinishedChecks'"'"','"'"'group_check_events'"'"',"state IN ('"'"'PENDING'"'"','"'"'WAITING'"'"','"'"'SENDING'"'"','"'"'QUEUED'"'"')"),
                      ):
                          emit(name,await db.fetchval('"'"'SELECT count(*) FROM '"'"'+table+'"'"' WHERE '"'"'+condition))
                      emit('"'"'HistoricalRecoveryStates'"'"',[dict(row) for row in await db.fetch('"'"'SELECT status,count(*) AS count FROM recovery_deliveries GROUP BY status ORDER BY status'"'"')])
                      emit('"'"'RetainedCounts'"'"',dict(await db.fetchrow('"'"''"'"''"'"'SELECT (SELECT count(*) FROM users) AS users,(SELECT count(*) FROM managed_groups) AS groups,(SELECT count(*) FROM scam_records) AS scam,(SELECT count(*) FROM trusted_designations) AS trusted,(SELECT count(*) FROM group_sanctions) AS sanctions,(SELECT count(*) FROM audit_events) AS audit,(SELECT count(*) FROM recovery_campaigns) AS legacy_campaigns,(SELECT count(*) FROM recovery_subscriptions) AS legacy_subscriptions,(SELECT count(*) FROM recovery_deliveries) AS legacy_deliveries'"'"''"'"''"'"')))
              finally:
                  await db.close()
          
          try:
              asyncio.run(main())
          except Exception as error:
              emit('"'"'NavigationStage2VerificationFailed'"'"',{'"'"'type'"'"':type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
