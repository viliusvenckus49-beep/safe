name: SAFECheck isolated release preparation diagnostics
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Prepare tested candidate without migration or main bot restart
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n python3 -c 'import importlib.util
          import json
          import sys
          from pathlib import Path
          
          root=Path(sys.argv[1])
          spec=importlib.util.spec_from_file_location('"'"'release_probe'"'"',root/'"'"'deploy/production_release.py'"'"')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          known={
          '"'"'Use an immutable SHA release directory'"'"','"'"'Original production bot is not running'"'"',
          '"'"'Unknown production Compose project'"'"','"'"'Missing production source'"'"','"'"'Unreviewed migration chain'"'"',
          '"'"'Invalid release version'"'"','"'"'Production data service is not healthy'"'"',
          '"'"'Unfinished or uncertain production work; reconcile first'"'"',
          '"'"'Another running container shares the production network'"'"',
          '"'"'Insufficient release disk space'"'"','"'"'Insufficient release memory'"'"',
          '"'"'Production data service configuration differs'"'"','"'"'Production volume or credential paths differ'"'"',
          '"'"'Production database/cache container changed'"'"'}
          class TracedRelease(module.Release):
              def run(self,args,**kwargs):
                  if args[:2]==['"'"'docker'"'"','"'"'build'"'"']:
                      print('"'"'PrepareStage=BUILD'"'"',flush=True)
                  return super().run(args,**kwargs)
              def idle(self):
                  print('"'"'PrepareStage=IDLE'"'"',flush=True)
                  return super().idle()
              def writers(self):
                  print('"'"'PrepareStage=WRITERS'"'"',flush=True)
                  return super().writers()
          try:
              release=TracedRelease(root,root.name)
              release.prepare()
              print('"'"'ProductionPrepare=PASS; NoMigration=True; MainBotUnchanged=True'"'"',flush=True)
          except Exception as error:
              reason=str(error)
              print('"'"'ProductionPrepareBlocked='"'"'+json.dumps({'"'"'type'"'"':type(error).__name__,'"'"'reason'"'"':reason if reason in known else '"'"'withheld'"'"'}),flush=True)
          ' "$HOME/safecheck-releases/35787658fd8389a43487f4aa25f7ea22f4f16b68"
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import json
          import asyncpg
          from app.config import Settings
          from app.health import snapshot
          
          def emit(name,value):
              print(name+'"'"'='"'"'+json.dumps(value,default=str,sort_keys=True))
          
          async def main():
              state=snapshot()
              emit('"'"'RuntimeHeartbeat'"'"',state)
              if not state['"'"'healthy'"'"']:
                  raise RuntimeError('"'"'Runtime unhealthy'"'"')
              db=await asyncpg.connect(Settings().database_url.replace('"'"'postgresql+asyncpg:'"'"','"'"'postgresql:'"'"'))
              try:
                  async with db.transaction(readonly=True,isolation='"'"'repeatable_read'"'"'):
                      revision=await db.fetchval('"'"'SELECT version_num FROM alembic_version'"'"')
                      emit('"'"'ChecksSchema'"'"',revision)
                      if revision not in {'"'"'0022'"'"','"'"'0023'"'"'}:
                          raise RuntimeError('"'"'Expected Checks schema'"'"')
                      pending=await db.fetch("SELECT j.id,j.sanction_id,j.operation,j.status,j.result,j.attempts,j.available_at,s.kind,s.status AS sanction_status,s.chat_id FROM group_sanction_jobs j JOIN group_sanctions s ON s.id=j.sanction_id WHERE j.status IN ('"'"'PENDING'"'"','"'"'PROCESSING'"'"','"'"'UNCERTAIN'"'"') ORDER BY j.id LIMIT 20")
                      emit('"'"'PendingNativeJobs'"'"',[dict(r) for r in pending])
                      ads=await db.fetch("SELECT id,status FROM ad_publication_attempts WHERE status IN ('"'"'CLAIMED'"'"','"'"'SENDING'"'"','"'"'UNCERTAIN'"'"') ORDER BY id LIMIT 20")
                      emit('"'"'PendingAds'"'"',[dict(r) for r in ads])
                      rows=await db.fetch('"'"'SELECT chat_id,version,actions,check_on_join,delete_messages,notify_result,mute_seconds FROM group_check_settings ORDER BY chat_id'"'"')
                      emit('"'"'ChecksPolicies'"'"',[dict(r) for r in rows])
                      states=await db.fetch('"'"'SELECT state,count(*) AS count FROM group_check_events GROUP BY state ORDER BY state'"'"')
                      emit('"'"'ChecksEvents'"'"',[dict(r) for r in states])
                      invalid=await db.fetchval("SELECT count(*) FROM group_check_events e JOIN group_sanction_jobs j ON j.sanction_id=e.sanction_id WHERE j.operation='"'"'APPLY'"'"' AND (e.notice_message_id IS NULL OR e.notice_sent_at IS NULL OR e.execute_after IS NULL OR e.execute_after<e.notice_sent_at+interval '"'"'15 seconds'"'"' OR j.created_at<e.execute_after)")
                      emit('"'"'EarlyOrUnannouncedCheckActions'"'"',invalid)
                      if invalid:
                          raise RuntimeError('"'"'Notice grace invariant failed'"'"')
                      policies=await db.fetch('"'"'SELECT chat_id,warning_limit,warning_action,warning_mute_seconds,warning_version FROM group_moderation_settings ORDER BY chat_id'"'"')
                      emit('"'"'WarningPolicies'"'"',[dict(r) for r in policies])
              finally:
                  await db.close()
          try:
              asyncio.run(main())
          except Exception as error:
              emit('"'"'ReadOnlyChecksVerificationFailed'"'"',{'"'"'type'"'"':type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
