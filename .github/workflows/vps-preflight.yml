name: SAFECheck retirement verification and disk inventory
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Verify test retirement, unchanged production and remaining disk usage
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n python3 -c 'import json,os,shutil,subprocess
          from pathlib import Path
          D=['"'"'docker'"'"','"'"'--host=unix:///var/run/docker.sock'"'"']
          PREFIX='"'"'safecheck-redtrust-mtproto-test-20261020'"'"'
          EXPECTED={'"'"'safecheck-bot-1'"'"':'"'"'b9fcdac162e7860ea6e56136a8955a5370a22b03eec7956a6fae2f36fc1f0dac'"'"','"'"'safecheck-postgres-1'"'"':'"'"'66aafc7f4afe51ba0ecc246932e9a7bdea3ef81c0d06c1f6818450595692c334'"'"','"'"'safecheck-redis-1'"'"':'"'"'6b2a1d17f3ec0a0b017a6af6baedd496234f378ac82bc4d801e7b0d0c599e747'"'"'}
          ENV=dict(os.environ)
          for key in ('"'"'DOCKER_HOST'"'"','"'"'DOCKER_CONTEXT'"'"','"'"'DOCKER_TLS'"'"','"'"'DOCKER_TLS_VERIFY'"'"','"'"'DOCKER_CERT_PATH'"'"'):ENV.pop(key,None)
          def run(args):return subprocess.check_output(args,text=True,timeout=60,env=ENV)
          def emit(name,value):print(name+'"'"'='"'"'+json.dumps(value,ensure_ascii=True,sort_keys=True),flush=True)
          assert os.geteuid()==0
          assert not (Path('"'"'/home/ubuntu'"'"')/PREFIX).exists()
          for args in (['"'"'ps'"'"','"'"'-a'"'"','"'"'--format'"'"','"'"'{{.Names}}'"'"'],['"'"'volume'"'"','"'"'ls'"'"','"'"'--format'"'"','"'"'{{.Name}}'"'"'],['"'"'network'"'"','"'"'ls'"'"','"'"'--format'"'"','"'"'{{.Name}}'"'"']):assert PREFIX not in run(D+args)
          emit('"'"'TestRetirementVerified'"'"',True)
          FMT='"'"'{"id":{{json .Id}},"started":{{json .State.StartedAt}},"image":{{json .Config.Image}},"health":{{json .State.Health.Status}},"mounts":{{json .Mounts}}}'"'"'
          for name,cid in EXPECTED.items():
           value=json.loads(run(D+['"'"'inspect'"'"','"'"'--format'"'"',FMT,name]))
           value['"'"'mounts'"'"']=sorted(value['"'"'mounts'"'"'],key=lambda m:m['"'"'Destination'"'"'])
           emit('"'"'ProductionStatus'"'"',dict(name=name,**value))
           assert value['"'"'id'"'"']==cid and value['"'"'health'"'"']=='"'"'healthy'"'"'
           assert value['"'"'started'"'"']<'"'"'2026-10-23T15:36:24'"'"'
          emit('"'"'BotRuntimeHealth'"'"',run(D+['"'"'exec'"'"','"'"'safecheck-bot-1'"'"','"'"'python'"'"','"'"'/run/configs/secret_entrypoint.py'"'"','"'"'python'"'"','"'"'-c'"'"','"'"'import json;from app.health import snapshot;s=snapshot();print(json.dumps(s,sort_keys=True));assert s["healthy"]'"'"']).strip())
          emit('"'"'HostMemory'"'"',{l.split('"'"':'"'"')[0]:int(l.split()[1])*1024 for l in Path('"'"'/proc/meminfo'"'"').read_text().splitlines() if l.startswith(('"'"'MemTotal:'"'"','"'"'MemAvailable:'"'"'))})
          emit('"'"'DiskUsage'"'"',dict(zip(('"'"'total'"'"','"'"'used'"'"','"'"'free'"'"'),shutil.disk_usage('"'"'/home/ubuntu'"'"'))))
          emit('"'"'DockerDiskSummary'"'"',run(D+['"'"'system'"'"','"'"'df'"'"']).strip())
          for directory in ('"'"'/home/ubuntu/safecheck-releases'"'"','"'"'/var/lib/safecheck'"'"','"'"'/var/backups/safecheck'"'"','"'"'/var/cache/apt/archives'"'"','"'"'/root/.cache/pip'"'"','"'"'/home/ubuntu/.cache/pip'"'"','"'"'/var/log/journal'"'"'):
           p=Path(directory)
           if p.is_dir() and not p.is_symlink():emit('"'"'KnownDirectoryBytes'"'"',{'"'"'path'"'"':directory,'"'"'bytes'"'"':int(run(['"'"'du'"'"','"'"'-sx'"'"','"'"'-B1'"'"',directory]).split()[0])})
          for line in run(D+['"'"'image'"'"','"'"'ls'"'"','"'"'--no-trunc'"'"','"'"'--format'"'"','"'"'{{json .}}'"'"']).splitlines():
           row=json.loads(line);emit('"'"'ImageInventory'"'"',{k:row.get(k) for k in ('"'"'ID'"'"','"'"'Repository'"'"','"'"'Tag'"'"','"'"'Size'"'"','"'"'CreatedAt'"'"')})'
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
