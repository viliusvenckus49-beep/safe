name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Root={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Compose={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          sudo -n test -f /etc/safecheck/compose.env && echo ComposeEnvironment=present
          sudo -n docker exec safecheck-bot-1 python -c 'import json; from app.health import snapshot; print("RuntimeHeartbeat="+json.dumps(snapshot(),sort_keys=True))'
          sudo -n docker inspect safecheck-bot-1 --format 'RestartCount={{.RestartCount}} Status={{.State.Status}}'
          sudo -n docker inspect safecheck-postgres-1 --format 'PostgresHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-redis-1 --format 'RedisHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-postgres-1 --format '{{range .Mounts}}PostgresMount={{.Type}} {{.Destination}}{{println}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          sudo -n docker logs --tail 300 safecheck-bot-1 2>&1 | python3 -c 'import collections,json,re,sys
          counts=collections.Counter()
          for line in sys.stdin:
              try:
                  data=json.loads(line)
              except (ValueError,TypeError):
                  continue
              if isinstance(data,dict):
                  event=str(data.get("event","")); error=str(data.get("exception_type",data.get("error_type","")))
                  if re.fullmatch(r"[A-Za-z0-9_]{1,100}",event) and re.fullmatch(r"[A-Za-z0-9_]{0,80}",error):
                      counts[(event,error)]+=1
          print("RecentRuntimeEvents="+json.dumps([{"event":e,"exception_type":t,"count":c} for (e,t),c in counts.most_common(12)],sort_keys=True))
          '
          sudo -n docker logs --tail 100 safecheck-postgres-1 2>&1 | python3 -c 'import collections,json,re,sys
          counts=collections.Counter()
          for line in sys.stdin:
              if "ERROR:" not in line:
                  continue
              value=line.split("ERROR:",1)[1].strip()
              value=re.sub(r"'"'"'[^'"'"']*'"'"'", "<redacted>", value)
              value=re.sub(r'"'"'"[^"\n]*"'"'"', "<identifier>", value)
              if value.startswith("invalid input syntax"):
                  value=value.split(":",1)[0]
              counts[value[:160]]+=1
          print("RecentDatabaseErrorKinds="+json.dumps(dict(counts),sort_keys=True))
          '
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio,json
          from sqlalchemy import select,text
          from sqlalchemy.exc import DBAPIError
          from app.config import Settings
          from app.db import create_database
          from app.models import AuditEvent
          async def main():
              engine,sessions=create_database(Settings().database_url)
              try:
                  for field,value in [("chat_id",-1004454398792),("user_id",8896102663)]:
                      async with sessions() as session:
                          await session.execute(text("SET TRANSACTION READ ONLY"))
                          try:
                              await session.scalar(select(AuditEvent.id).where(AuditEvent.details[field].as_integer()==value).limit(1))
                              result={"field":field,"result":"PASS"}
                          except DBAPIError as error:
                              result={"field":field,"result":"FAIL","type":type(error.orig).__name__,"sqlstate":getattr(error.orig,"sqlstate",None)}
                          finally:
                              await session.rollback()
                          print("ReadOnlyJsonIdCheck="+json.dumps(result,sort_keys=True))
              finally:
                  await engine.dispose()
          asyncio.run(main())
          '
          df -h /home/ubuntu
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
