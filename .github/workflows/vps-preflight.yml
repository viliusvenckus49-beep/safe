name: SAFECheck VPS preflight
on:
  push:
    branches: [scam-ban-diagnosis-2.14.0]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Root={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          sudo -n docker inspect safecheck-bot-1 --format 'Compose={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          sudo -n test -f /etc/safecheck/compose.env && echo ComposeEnvironment=present
          sudo -n docker inspect safecheck-postgres-1 --format 'PostgresHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-redis-1 --format 'RedisHealth={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker inspect safecheck-postgres-1 --format '{{range .Mounts}}PostgresMount={{.Type}} {{.Destination}}{{println}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python -c 'import app; print("SAFECheckVersion=" + app.__version__)'
          sudo -n docker exec -i safecheck-bot-1 python /run/configs/secret_entrypoint.py python - <<'PYDIAG'
          import asyncio,json
          from dataclasses import asdict
          from aiogram import Bot
          from aiogram.exceptions import TelegramAPIError
          from sqlalchemy import select,text
          from app.config import Settings
          from app.db import create_database
          from app.models import BanAction,ManagedGroup,ScamRecord,User
          from app.group_services import GroupService
          from app.bot.session import telegram_session
          from app.bot.group_runtime import _api_reason
          TARGET=8805206375
          async def main():
           s=Settings(_env_file=None)
           engine,sessions=create_database(s.database_url)
           bot=Bot(s.bot_token.get_secret_value(),session=telegram_session(s))
           try:
            async with sessions() as session:
             await session.execute(text('SET TRANSACTION READ ONLY'))
             records=list((await session.scalars(select(ScamRecord).join(User,ScamRecord.target_id==User.id).where(User.telegram_id==TARGET))).all())
             print('TargetRecords='+json.dumps([{'record':r.id,'status':r.status,'target':r.target_id} for r in records]))
             for r in records:
              print('TargetSummary='+json.dumps(asdict(await GroupService(s,session).ban_summary(r.id))))
             jobs=list((await session.scalars(select(BanAction).where(BanAction.telegram_id==TARGET).order_by(BanAction.id))).all())
             print('TargetJobs='+json.dumps([{'id':j.id,'record':j.scam_record_id,'chat_id':j.chat_id,'status':j.status,'attempts':j.attempts,'result':j.result_type,'next':str(j.next_attempt_at),'claimed':str(j.claimed_at)} for j in jobs]))
             groups=list((await session.scalars(select(ManagedGroup).where(ManagedGroup.approved.is_(True),ManagedGroup.enabled.is_(True)))).all())
             me=await asyncio.wait_for(bot.get_me(),8)
             for g in groups:
              result={'chat_id':g.chat_id,'title':g.title,'saved_restrict':g.can_restrict_members,'target':TARGET}
              for label,uid in [('bot',me.id),('target',TARGET)]:
               try:
                m=await asyncio.wait_for(bot.get_chat_member(g.chat_id,uid),8)
                result[label]={'status':m.status,'can_restrict':getattr(m,'can_restrict_members',None)}
               except TelegramAPIError as e:result[label]={'type':type(e).__name__,'reason':_api_reason(e)}
               except Exception as e:result[label]={'type':type(e).__name__}
              print('TargetGroup='+json.dumps(result,ensure_ascii=False))
           finally:
            await bot.session.close()
            await engine.dispose()
          try:asyncio.run(main())
          except Exception as e:print('DiagnosticError='+type(e).__name__);raise SystemExit(1)
          PYDIAG
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
