name: SAFECheck VPS preflight
on:
  push:
    branches: [safecheck-2.13.1]
    paths: ['.github/workflows/vps-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safecheck-vps-readonly-diagnostics
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Inspect existing deployment without changing it
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'Image={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
          sudo -n docker exec safecheck-bot-1 python /run/configs/secret_entrypoint.py python -c 'import asyncio
          import json
          import unicodedata
          
          import asyncpg
          from aiogram import Bot
          
          from app.bot.session import telegram_session
          from app.config import Settings
          from app.health import snapshot
          
          
          def emit(name, value):
              print(name + "=" + json.dumps(value, default=str, ensure_ascii=False, sort_keys=True))
          
          
          async def main():
              settings = Settings()
              emit("RuntimeHeartbeat", snapshot())
              connection = await asyncpg.connect(settings.database_url.replace("postgresql+asyncpg:", "postgresql:"))
              try:
                  async with connection.transaction(readonly=True, isolation="repeatable_read"):
                      groups = [dict(row) for row in await connection.fetch("SELECT chat_id,title,approved,enabled FROM managed_groups ORDER BY chat_id")]
                      relevant = [g for g in groups if "siaul" in unicodedata.normalize("NFKD",g["title"].lower()).encode("ascii","ignore").decode()]
                      emit("RelevantGroups", relevant)
                      emit("Identity", [dict(r) for r in await connection.fetch("SELECT id,telegram_id,username FROM users WHERE telegram_id=8896102663 OR lower(username)='"'"'redsafeads'"'"'")])
                      emit("Sanctions", [dict(r) for r in await connection.fetch("SELECT id,chat_id,telegram_id,kind,status,owned,actor_id,until_date,created_at,updated_at,replaces_sanction_id FROM group_sanctions WHERE telegram_id=8896102663 ORDER BY id DESC LIMIT 30")])
                      emit("Jobs", [dict(r) for r in await connection.fetch("SELECT j.id,j.sanction_id,j.operation,j.status,j.result,j.actor_id,j.automatic,j.attempts,j.available_at,j.updated_at FROM group_sanction_jobs j JOIN group_sanctions s ON s.id=j.sanction_id WHERE s.telegram_id=8896102663 ORDER BY j.id DESC LIMIT 40")])
                      emit("ScamStatus", [dict(r) for r in await connection.fetch("SELECT s.id,s.status,s.created_at,s.removed_at FROM scam_records s JOIN users u ON u.id=s.target_id WHERE u.telegram_id=8896102663 OR lower(u.username)='"'"'redsafeads'"'"'")])
                      emit("ScamBanJobs", [dict(r) for r in await connection.fetch("SELECT id,chat_id,scam_record_id,status,attempts,result_type,completed_at FROM ban_actions WHERE telegram_id=8896102663 ORDER BY id DESC LIMIT 20")])
                      emit("RecentModerationAudit", [dict(r) for r in await connection.fetch("SELECT id,actor_id,action,created_at,details->>'"'"'chat_id'"'"' AS chat_id,details->>'"'"'sanction_id'"'"' AS sanction_id,details->>'"'"'result'"'"' AS result FROM audit_events WHERE details->>'"'"'user_id'"'"'='"'"'8896102663'"'"' AND action LIKE '"'"'group_moderation_%'"'"' ORDER BY id DESC LIMIT 25")])
              finally:
                  await connection.close()
              async with Bot(settings.bot_token.get_secret_value(), session=telegram_session(settings)) as bot:
                  for group in relevant:
                      for target in (8896102663, bot.id):
                          try:
                              member = await bot.get_chat_member(group["chat_id"], target)
                              emit("TelegramState", {"chat_id":group["chat_id"],"telegram_id":target,"status":member.status,"until_date":getattr(member,"until_date",None),"is_member":getattr(member,"is_member",None),"can_restrict_members":getattr(member,"can_restrict_members",None),"can_send_messages":getattr(member,"can_send_messages",None)})
                          except Exception as error:
                              emit("TelegramState", {"chat_id":group["chat_id"],"telegram_id":target,"error_type":type(error).__name__})
          
          
          try:
              asyncio.run(main())
          except Exception as error:
              emit("ReadOnlyAuditFailed", {"type":type(error).__name__})
              raise SystemExit(1) from None
          '
          REMOTE
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
