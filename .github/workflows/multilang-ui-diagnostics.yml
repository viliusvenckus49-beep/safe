name: SAFECheck restore main bot after expired MTProto session
on:
  push:
    branches: [multilang-ui-diagnostics-20261009]
    paths: ['.github/workflows/multilang-ui-diagnostics.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned read-only VPS access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Restore bot without unauthenticated account relay
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'sudo -n python3 -' <<'PY'
          import importlib.util,json,os,re,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          selector=Path('/etc/safecheck/compose.env')
          values={}
          for line in selector.read_text().splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  key,value=line.split('=',1)
                  values[key.strip()]=value.strip().strip('\"\'')
          path=Path(values['SAFECHECK_ENV_FILE'])
          assert path.is_absolute() and path.is_relative_to('/etc/safecheck') and not path.is_symlink()
          assert path.stat().st_uid==0
          content=path.read_text()
          pattern=re.compile(r'^GROUP_HELP_ENABLED=.*$',re.MULTILINE)
          assert len(pattern.findall(content))==1,'Expected one explicit relay switch'
          updated=pattern.sub('GROUP_HELP_ENABLED=false',content)
          root=subprocess.run(['docker','inspect','--format','{{index .Config.Labels "com.docker.compose.project.working_dir"}}','safecheck-bot-1'],capture_output=True,check=True,text=True).stdout.strip()
          spec=importlib.util.spec_from_file_location('safecheck_ops',Path(root)/'deploy/ops.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          with module.Operations(module.parser().parse_args(['--root',root,'start'])).lock(maintenance=True):
              backup=path.with_name(path.name+'.before-relay-recovery-'+datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ'))
              module.private_write(backup,content)
              module.private_write(path,updated)
              command=['docker','compose','--project-name','safecheck','--env-file',str(selector),'-f',root+'/docker-compose.production.yml','up','-d','--no-deps','--wait','--wait-timeout','240','bot']
              result=subprocess.run(command,capture_output=True,timeout=300)
              print('RECOVERY_COMPOSE_EXIT='+str(result.returncode))
              if result.returncode:
                  raise RuntimeError('Recovery startup did not pass health checks')
          print('RECOVERY_RELAY_SUSPENDED=true')
          print('RECOVERY_RUNTIME_BACKUP='+str(backup))
          image=subprocess.run(['docker','inspect','--format','{{.Config.Image}}','safecheck-bot-1'],capture_output=True,check=True,text=True).stdout.strip()
          health=subprocess.run(['docker','exec','safecheck-bot-1','python','-c','from app.health import snapshot; import json; print(json.dumps(snapshot()))'],capture_output=True,check=True,text=True).stdout.strip()
          print('RECOVERY_IMAGE='+image)
          print('RECOVERY_HEALTH='+health)
          print('RECOVERY_DATABASE_UNCHANGED=true')
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
