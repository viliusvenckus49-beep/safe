name: SAFECheck prepare secure account reconnect helper
on:
  push:
    branches: [multilang-ui-diagnostics-20261009]
    paths: ['.github/workflows/multilang-ui-diagnostics.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare pinned read-only VPS access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Prepare and verify interactive helper without logging in
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'sudo -n python3 -' <<'PY'
          import ast,subprocess
          from pathlib import Path
          root=subprocess.run(['docker','inspect','--format','{{index .Config.Labels "com.docker.compose.project.working_dir"}}','safecheck-bot-1'],capture_output=True,check=True,text=True).stdout.strip()
          root=Path(root)
          assert root.is_absolute() and (root/'deploy/mtproto-tools.Dockerfile').is_file()
          result=subprocess.run(['docker','build','-f',str(root/'deploy/mtproto-tools.Dockerfile'),'-t','safecheck-mtproto-tools:1.42.0',str(root/'deploy')],capture_output=True,timeout=180)
          assert result.returncode==0,'Account helper build failed'
          code="import ast,json; from pathlib import Path; tree=ast.parse(Path('/app/mtproto_login.py').read_text()); values={node.targets[0].id:ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('STAFF_CHAT_ID','STAFF_BOT')}; print(json.dumps(values))"
          probe=subprocess.run(['docker','run','--rm','--read-only','--tmpfs','/tmp','--cap-drop','ALL','--security-opt','no-new-privileges','--entrypoint','python','safecheck-mtproto-tools:1.42.0','-c',code],capture_output=True,check=True,text=True,timeout=30)
          import json
          values=json.loads(probe.stdout)
          assert values=={'STAFF_CHAT_ID':-1004300060813,'STAFF_BOT':'ghStaffBot'}
          state=Path('/etc/safecheck/mtproto')
          assert state.is_dir() and state.stat().st_uid==10001 and state.stat().st_mode & 0o077==0
          assert (state/'api.json').is_file() and (state/'account.session').is_file()
          print('RECONNECT_HELPER_READY=true')
          print('RECONNECT_STAFF_ID='+str(values['STAFF_CHAT_ID']))
          print('RECONNECT_PRIVATE_STATE_VERIFIED=true')
          print('RECONNECT_COMMAND=sudo docker run --rm -it --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --mount type=bind,src=/etc/safecheck/mtproto,dst=/state safecheck-mtproto-tools:1.42.0 --state-dir /state')
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
