name: SAFECheck dispatch tested REDSAFE reference spacing
on:
  push:
    branches: [group-members-import-20261009]
    paths: ['.github/workflows/group-members-import.yml']
permissions:
  contents: read
  actions: write
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the existing backup-first deployment for tested main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 1ff00ba16c6d15c045261035b4906ae3750d57ab
        run: |
          set -eu
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$current_main_sha" = "$EXPECTED_MAIN_SHA"
          gh workflow run vps-deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
          printf 'DEPLOY_DISPATCHED_MAIN=%s\n' "$EXPECTED_MAIN_SHA"
