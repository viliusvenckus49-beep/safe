name: SAFECheck verify imported member identities
on:
  push:
    branches: [group-members-import-20261009]
    paths: ['.github/workflows/group-members-import.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare pinned read-only VPS access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Verify directory duplicates and preserved historical identities
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" 'sudo -n python3 -' <<'PY'
          import json,subprocess
          from pathlib import Path
          code = '''import asyncio,json,runpy
          from collections import Counter
          from sqlalchemy import func,select
          runpy.run_path('/run/configs/secret_entrypoint.py')['load_secrets']()
          from app.config import Settings
          from app.db import create_database
          from app.models import User
          from app.repositories import Repository
          from app.services import Service
          async def main():
           settings=Settings()
           engine,sessions=create_database(settings.database_url)
           try:
            async with sessions() as session:
             core=Service(settings,session)
             await core.require_admin(settings.group_owner)
             directory,total=await core.repo.users(0,100000)
             if len(directory)!=total:raise ValueError('Directory verification incomplete')
             names=Counter(u.username.casefold() for u in directory if u.username)
             ids=Counter(u.telegram_id for u in directory if u.telegram_id is not None)
             grouped=(await session.execute(select(func.lower(User.username),func.count(User.id),func.count(User.telegram_id)).where(User.username.is_not(None)).group_by(func.lower(User.username)).having(func.count(User.id)>1))).all()
             known_names=(await session.execute(select(func.lower(User.username),func.count(User.id)).where(User.username.is_not(None),User.telegram_id.is_not(None)).group_by(func.lower(User.username)).having(func.count(User.id)>1))).all()
             result={'visible_users':total,'visible_username_duplicates':sum(n>1 for n in names.values()),'visible_telegram_id_duplicates':sum(n>1 for n in ids.values()),'known_identity_username_duplicates':len(known_names),'historical_username_pairs':sum(numeric==1 and count==2 for _,count,numeric in grouped),'other_duplicate_groups':sum(not(numeric==1 and count==2) for _,count,numeric in grouped)}
             if result['visible_username_duplicates'] or result['visible_telegram_id_duplicates'] or result['known_identity_username_duplicates'] or result['other_duplicate_groups']:raise ValueError('Current directory still duplicates identities')
             print('MEMBER_DUPLICATE_VERIFICATION='+json.dumps(result))
           finally:await engine.dispose()
          try:asyncio.run(main())
          except Exception as error:print('MEMBER_VERIFICATION_ERROR='+type(error).__name__);raise SystemExit(1)
          '''
          result=subprocess.run(['docker','exec','safecheck-bot-1','python','-c',code],capture_output=True,text=True,timeout=60)
          for line in result.stdout.splitlines():
           if line.startswith(('MEMBER_DUPLICATE_VERIFICATION=','MEMBER_VERIFICATION_ERROR=')):print(line,flush=True)
          if result.returncode:raise SystemExit(1)
          health=subprocess.run(['docker','exec','safecheck-bot-1','python','-c','from app.health import snapshot; import json; print(json.dumps(snapshot()))'],capture_output=True,check=True,text=True,timeout=30)
          value=json.loads(health.stdout)
          assert value['healthy']
          print('MEMBER_FINAL_HEALTH='+json.dumps(value),flush=True)
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
