name: SAFECheck remove fixed user directory records
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Prepare pinned read-only VPS access
      env:
        DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        HOST: ${{ secrets.VPS_HOST }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
      run: 'set -eu

        test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"

        install -d -m 700 "$HOME/.ssh"

        umask 077

        printf ''%s\n'' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"

        ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null

        printf ''%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n'' "$HOST" > "$HOME/.ssh/known_hosts"

        '
    - name: Backup and delete the fixed authorized range transactionally
      env:
        HOST: ${{ secrets.VPS_HOST }}
        REMOTE_USER: ${{ secrets.VPS_USER }}
      run: "set -eu\nSSH_OPTIONS=(-i \"$HOME/.ssh/safecheck_deploy\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)\nssh \"${SSH_OPTIONS[@]}\" \"$REMOTE_USER@$HOST\" 'sudo -n python3 -' <<'PY'\nimport hashlib,importlib.util,json,os,subprocess\nfrom pathlib import Path\nos.umask(0o077)\ncode = '\"\"\"Delete only the previously frozen, explicitly requested directory records.\"\"\"\\nimport asyncio\\nimport json\\nimport runpy\\nimport sys\\n\\nrunpy.run_path(\\'/run/configs/secret_entrypoint.py\\')[\\'load_secrets\\']()\\nfrom sqlalchemy import delete, func, inspect, or_, select, text\\nfrom app.config import Settings\\nfrom app.db import create_database\\nfrom app.models import Administrator, Base, OperationLock, User\\nfrom app.services import Service\\n\\nasync def main(payload):\\n    preview = payload[\\'selection\\']\\n    if preview[\\'source\\'] != \\'current_safecheck_users_directory\\' or (preview[\\'first\\'], preview[\\'last\\']) != (137, 187):\\n        raise ValueError(\\'Unexpected directory selection\\')\\n    selected = preview[\\'users\\']\\n    ids = [row[\\'id\\'] for row in selected]\\n    tg_ids = [row[\\'telegram_id\\'] for row in selected if row[\\'telegram_id\\'] is not None]\\n    if len(ids) != 51 or len(set(ids)) != 51 or [row[\\'position\\'] for row in selected] != list(range(137,188)):\\n        raise ValueError(\\'Selection must contain exactly the fixed 51 records\\')\\n    if any(type(value) is not int or value <= 0 for value in ids + tg_ids):\\n        raise ValueError(\\'Invalid stable identity\\')\\n    settings = Settings()\\n    engine, sessions = create_database(settings.database_url)\\n    try:\\n        async with sessions() as session:\\n            service = Service(settings, session)\\n            await service.require_admin(settings.group_owner)\\n            if session.get_bind().dialect.name != \\'postgresql\\':\\n                raise ValueError(\\'Unexpected production database dialect\\')\\n            await session.execute(text(\"SET LOCAL lock_timeout = \\'5s\\'\"))\\n            await session.execute(text(\"SET LOCAL statement_timeout = \\'30s\\'\"))\\n            await service.repo.lock_identity_metadata()\\n            await session.execute(text(\\'LOCK TABLE users, operation_locks IN SHARE ROW EXCLUSIVE MODE\\'))\\n            current = (await session.scalars(select(User).where(User.id.in_(ids)).with_for_update())).all()\\n            if len(current) != 51:\\n                raise ValueError(\\'Fixed selection no longer exists in full\\')\\n            by_id = {row.id: row for row in current}\\n            for original in selected:\\n                row = by_id[original[\\'id\\']]\\n                if (row.telegram_id, row.username, row.display_name, row.updated_at.isoformat()) != (original[\\'telegram_id\\'],original[\\'username\\'],original[\\'display_name\\'],original[\\'updated_at\\']):\\n                    raise ValueError(\\'Selected identity changed after preview\\')\\n            if settings.group_owner in tg_ids or await session.scalar(select(func.count()).select_from(Administrator).where(Administrator.telegram_id.in_(tg_ids))):\\n                raise ValueError(\\'Administrator identity cannot be removed by this cleanup\\')\\n            # Refuse to erase judgments or history, including unexpected live-schema references.\\n            connection = await session.connection()\\n            def live_references(conn):\\n                schema = inspect(conn)\\n                return {(name, column) for name in schema.get_table_names() for fk in schema.get_foreign_keys(name) if fk[\\'referred_table\\']==\\'users\\' for column in fk[\\'constrained_columns\\']}\\n            actual = await connection.run_sync(live_references)\\n            expected = {(table.name, fk.parent.name) for table in Base.metadata.tables.values() for fk in table.foreign_keys if fk.column.table.name==\\'users\\'}\\n            if actual != expected:\\n                raise ValueError(\\'User dependency schema differs from inspected code\\')\\n            for table in Base.metadata.sorted_tables:\\n                columns = [fk.parent for fk in table.foreign_keys if fk.column.table.name==\\'users\\']\\n                if not columns or table.name==\\'operation_locks\\':\\n                    continue\\n                count = await session.scalar(select(func.count()).select_from(table).where(or_(*(column.in_(ids) for column in columns))))\\n                if count:\\n                    raise ValueError(\\'Selected identities acquired protected references\\')\\n            for name in (\\'observed_members\\',\\'private_contacts\\',\\'recovery_subscriptions\\',\\'recovery_deliveries\\',\\'ban_actions\\'):\\n                table=Base.metadata.tables[name]\\n                if await session.scalar(select(func.count()).select_from(table).where(table.c.telegram_id.in_(tg_ids))):\\n                    raise ValueError(\\'Selected identity has group or delivery state\\')\\n            before = await session.scalar(select(func.count()).select_from(User))\\n            before_directory = (await service.repo.users(0,1))[1]\\n            locks = await session.execute(delete(OperationLock).where(OperationLock.user_id.in_(ids)))\\n            removed = await session.execute(delete(User).where(User.id.in_(ids)))\\n            if removed.rowcount != 51:\\n                raise ValueError(\\'Unexpected deletion count\\')\\n            after = await session.scalar(select(func.count()).select_from(User))\\n            after_directory = (await service.repo.users(0,1))[1]\\n            if after != before-51 or after_directory != before_directory-51:\\n                raise ValueError(\\'Deletion affected unexpected directory records\\')\\n            if await session.scalar(select(func.count()).select_from(User).where(or_(User.id.in_(ids), User.telegram_id.in_(tg_ids)))):\\n                raise ValueError(\\'Selected identities still exist\\')\\n            service._audit(settings.group_owner,\\'user_directory_removal\\',None,first=137,last=187,count=51,manifest_sha256=payload[\\'manifest_sha256\\'])\\n            await session.commit()\\n            print(\\'USER_CLEANUP=\\'+json.dumps({\\'removed\\':removed.rowcount,\\'removed_operation_locks\\':locks.rowcount,\\'users_before\\':before,\\'users_after\\':after,\\'directory_before\\':before_directory,\\'directory_after\\':after_directory,\\'transaction_committed\\':True}))\\n    finally:\\n        await engine.dispose()\\n\\ntry:\\n    asyncio.run(main(json.load(sys.stdin)))\\nexcept Exception as error:\\n    print(\\'USER_CLEANUP_ERROR=\\'+type(error).__name__)\\n    raise SystemExit(1) from None\\n'\nmanifest=Path('/home/ubuntu/safecheck-exports/remove-users-137-187-20261009.json')\nsha=hashlib.sha256(manifest.read_bytes()).hexdigest()\nif sha!='36440c91e701779f3cca20be834d8b828e04c6a997df8fcc31584db7074566c3':raise SystemExit('USER_CLEANUP_ERROR=ManifestChanged')\nselection=json.loads(manifest.read_text())\nif selection['selected_administrator_records'] or selection['owner_selected']:raise SystemExit('USER_CLEANUP_ERROR=AdministratorSelected')\nservices=('safecheck-bot-1','safecheck-postgres-1','safecheck-redis-1','safecheck-ui-studio-studio-1')\ndef command(args,*,input=None,timeout=90):\n result=subprocess.run(args,input=input,capture_output=True,text=True,timeout=timeout)\n if result.returncode:\n  for line in result.stdout.splitlines():\n   if line.startswith('USER_CLEANUP_ERROR='):print(line,flush=True)\n  raise RuntimeError('Runtime operation failed')\n return result.stdout\noriginal=command(['docker','inspect','--format','{{.Id}} {{.Image}} {{.State.StartedAt}}',*services])\nhealth=json.loads(command(['docker','exec','safecheck-bot-1','python','-c','from app.health import snapshot;import json;print(json.dumps(snapshot()))']))\nif not health['healthy']:raise SystemExit('USER_CLEANUP_ERROR=BotUnhealthyBeforeCleanup')\nroot=Path(command(['docker','inspect','--format','{{index .Config.Labels \"com.docker.compose.project.working_dir\"}}','safecheck-bot-1']).strip())\nif not root.is_absolute() or not (root/'deploy/ops.py').is_file():raise SystemExit('USER_CLEANUP_ERROR=OperationsUnavailable')\nspec=importlib.util.spec_from_file_location('safecheck_ops',root/'deploy/ops.py')\nmodule=importlib.util.module_from_spec(spec)\nspec.loader.exec_module(module)\nops=module.Operations(module.parser().parse_args(['--root',str(root),'backup']))\nwith ops.lock(maintenance=True):\n archive=ops.backup()\n print('USER_CLEANUP_BACKUP='+str(archive),flush=True)\n output=command(['docker','exec','-i','safecheck-bot-1','python','-c',code],input=json.dumps({'selection':selection,'manifest_sha256':sha}),timeout=120)\n values=[json.loads(line.removeprefix('USER_CLEANUP=')) for line in output.splitlines() if line.startswith('USER_CLEANUP=')]\n if len(values)!=1 or values[0]['removed']!=51 or not values[0]['transaction_committed']:raise SystemExit('USER_CLEANUP_ERROR=ResultIncomplete')\n summary=values[0]\n summary['backup']=str(archive)\n health=json.loads(command(['docker','exec','safecheck-bot-1','python','-c','from app.health import snapshot;import json;print(json.dumps(snapshot()))']))\n if not health['healthy'] or command(['docker','inspect','--format','{{.Id}} {{.Image}} {{.State.StartedAt}}',*services])!=original:raise SystemExit('USER_CLEANUP_ERROR=HealthChanged')\n summary['healthy']=True\n summary['services_unchanged']=True\n receipt=manifest.with_suffix('.removed.json')\n with receipt.open('x',encoding='utf-8') as handle:json.dump(summary,handle,indent=2)\n receipt.chmod(0o600)\n import pwd\n owner=pwd.getpwnam('ubuntu')\n os.chown(receipt,owner.pw_uid,owner.pw_gid)\n print('USER_CLEANUP_RESULT='+json.dumps(summary),flush=True)\n\nPY\n"
    - name: Remove runner key
      if: always()
      run: rm -f "$HOME/.ssh/safecheck_deploy"
'on':
  push:
    branches:
    - group-members-import-20261009
    paths:
    - .github/workflows/group-members-import.yml
