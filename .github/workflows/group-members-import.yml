name: SAFECheck VPS safe cleanup plan
on:
  push:
    branches: [group-members-import-20261009]
    paths: ['.github/workflows/group-members-import.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Prepare pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: SAFECheck VPS safe cleanup plan
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: "ssh -i \"$HOME/.ssh/safecheck_deploy\" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \"$REMOTE_USER@$HOST\" 'sudo -n python3 -' <<'PY'\nimport fcntl,hashlib,json,os,re,shutil,subprocess,time\nfrom pathlib import Path\n\nMODE='PLAN'\nCANDIDATES=[{\"id\":\"sha256:97c9ac767de799289ddebea525b352bbe3aeaade355acf7a519b9f34eea5f570\",\"tag\":\"safecheck:2.15.4-172c56aa8d42\"},{\"id\":\"sha256:9a044ae3a3a61e355b5b0ebee9077165740616e8cf2a312c0fd7705c2fa710dc\",\"tag\":\"safecheck:2.15.4-bec6b56d9105\"},{\"id\":\"sha256:fe70973f75d87b66456f08dcac7cce366ffe2b2d1f936ce3609fca8429f259ca\",\"tag\":\"safecheck:2.15.4-18b67efdd583\"},{\"id\":\"sha256:e6d9a0177e015cbf17b2eb1bfedb851c04f0b5c9e2b5c30aa00d9789b9ed7b43\",\"tag\":\"safecheck:2.15.4-58a309a7f2e5\"},{\"id\":\"sha256:457dbb3ab860045b589fd50d233aec736f566c7c40e851fea9775fd50d618a1a\",\"tag\":\"safecheck:2.15.4-1ad4be2bc1d6\"},{\"id\":\"sha256:71b1b7a40250358e52ebffdb22db058293ba8c2c988a5a73b80848c86c734b72\",\"tag\":\"safecheck:2.15.4-60bcf66ef711\"},{\"id\":\"sha256:4c25fea23e267911d87bad9ac939a86df849ca21e3d1cfa1a6b2c12c9fe526ca\",\"tag\":\"safecheck:2.15.4-eee0d5ae25fe\"},{\"id\":\"sha256:7f86eff15675001170edf8d98cb7d95718e804c0702dec435e20faf2502de52b\",\"tag\":\"safecheck:2.15.4-ce0bca973fec\"},{\"id\":\"sha256:9702d046a6ac1a3b4d0615788d457a331d00d12c4866bba4910a82ed95ae02b8\",\"tag\":\"safecheck:2.15.4-1aeca1208eb1\"},{\"id\":\"sha256:927d5179d7662819c57488cda2166f3f0dfe2c73143bcbf0ee84ecb1b76f1db6\",\"tag\":\"safecheck:2.15.4-bc3fe1790e71\"},{\"id\":\"sha256:7e47ef38a5950fb291ab0e594eceaad41ba9dea76d8e1b21ed75ed59d3fcaba6\",\"tag\":\"safecheck:2.15.4-981be164d5d9\"},{\"id\":\"sha256:63d61efddb5e4e1fd9c4a5e0b034fc98d01362079c6e70a68a93855671ff5bfd\",\"tag\":\"safecheck:2.15.4-c5119312e4c9\"},{\"id\":\"sha256:5f7480be0c8f5728fc9e44e78a191884d49e004a7dc409b68a8620f0da2a8416\",\"tag\":\"safecheck:2.15.4-858d76b922c2\"},{\"id\":\"sha256:8bbc3e6948369bd06f983263ab8fdf2856b93547252255e3dd8b25abd63b61d4\",\"tag\":\"safecheck:2.15.4-3cacbe6cc1be\"},{\"id\":\"sha256:e151fcc8a00e825f31e562ddef6129b1e1c1f246d28d7f85f21039a16f6f5bc9\",\"tag\":\"safecheck:2.15.4-47909dfe8ed9\"},{\"id\":\"sha256:4dce9bae76cc7927f814655b6f0b1f0fe6c0cd081927effaf0ce3077679903d2\",\"tag\":\"safecheck:2.15.3-1f5ad5c23d7a\"},{\"id\":\"sha256:99c20cef007f6d7ef6794576383a5561959618520e539ca35174c09fc08d6e6a\",\"tag\":\"safecheck:2.15.2-00ce1f4cad8a\"},{\"id\":\"sha256:fe650fde1bb196fc60e78354ae18307e1bbf48bd500e8af5ea56a0975da414eb\",\"tag\":\"safecheck:2.15.1-bcd1017e92af\"},{\"id\":\"sha256:b3d8ba009810f1bc26234ce72bbfbf1312cf32246e25fd8c6030ec82a14764c9\",\"tag\":\"safecheck:2.15.0-db42de356cdb\"},{\"id\":\"sha256:d61738f47ac5f7eba0fa7be96af7c8320e5b419b18784bde6b977a3ffdf0d7a1\",\"tag\":\"safecheck:2.14.4-9dfc62aff106\"},{\"id\":\"sha256:49bba033eb410df38fbb0767fa42be636c6ee5b2b7c92f3ced4c0027400e5712\",\"tag\":\"safecheck:2.14.3-8372b5d50805\"},{\"id\":\"sha256:16ebf421544b09ef226590f47a25461ca971529b77bc835a94df37ef4dfb9a4e\",\"tag\":\"safecheck:2.14.3-860d0f1d72ac\"},{\"id\":\"sha256:254638707dcdb4164997339ad8780215d3b6c43007b10af298780d46c205adcc\",\"tag\":\"safecheck:2.14.2-e2a32f782475\"},{\"id\":\"sha256:30f231824eef19b4b05f8130cc0cea07f568c9d601a10b62cb9a9e4d7af1867a\",\"tag\":\"safecheck:2.14.1-886b134581eb\"},{\"id\":\"sha256:67852963b7076290448ce00df94c13d0c634a009575d37d9e72cd6d8fef9acde\",\"tag\":\"safecheck:2.14.0-a479d7a95d9f\"},{\"id\":\"sha256:f88837895241562b607953575340c3a7d168deaa21d883a8deef6254598065ba\",\"tag\":\"safecheck:2.13.2-b3836f6543c1\"},{\"id\":\"sha256:9bddeed014a2bb34174574ba4cf884e4638f08f2b10e63876894d5cc029c094b\",\"tag\":\"safecheck:2.13.1-097708593d98\"},{\"id\":\"sha256:5dd99cdf58c8904cb4e75c562db761f5016f8b07cc6be93444dfced48e7dd515\",\"tag\":\"safecheck:2.13.1-33f87abd979c\"},{\"id\":\"sha256:6256f6d295eb5ec371547d4e3e1bac96415a812a1e3c0b03d200d0f8171f3fdc\",\"tag\":\"safecheck-ui:0882945f46a6\"}]\nKEEP_TAGS=[\"safecheck:2.15.4-4836d1975afc\",\"safecheck:2.15.4-1ff00ba16c6d\",\"safecheck:2.15.4-b428670bc684\",\"safecheck-ui:9b212df5a2cf\",\"safecheck-ui:c0a2a6bd449c\",\"safecheck-mtproto-tools:1.42.0-staff-switch\",\"safecheck-mtproto-tools:1.42.0-account-switch\",\"safecheck-mtproto-tools:1.42.0\",\"safecheck:2.13.0\",\"python:3.12-slim\",\"postgres:17.6-alpine\",\"redis:7.4.5-alpine\"]\n\ndef run(args,timeout=120,check=True):\n r=subprocess.run(args,capture_output=True,text=True,timeout=timeout)\n if check and r.returncode:raise RuntimeError('Command failed: '+args[0]+' '+str(r.returncode))\n return r\n\ndef inspect_image(ref):\n r=run(['docker','image','inspect','--format','{{.Id}}',ref],check=False)\n return r.stdout.strip() if r.returncode==0 else None\n\ndef containers():\n ids=run(['docker','ps','-aq','--no-trunc']).stdout.split()\n result={}\n for cid in ids:\n  # Never inspect or display environment variables.\n  fmt='{{json .Id}}\\t{{json .Name}}\\t{{json .Image}}\\t{{json .State.Status}}\\t{{json .Mounts}}'\n  values=run(['docker','inspect','--format',fmt,cid]).stdout.strip().split('\\t')\n  row=[json.loads(v) for v in values]\n  result[row[1]]={'id':row[0],'image':row[2],'status':row[3],'mounts':row[4]}\n return result\n\ndef manifest(root):\n root=Path(root)\n if not root.exists():return None\n rows=[]\n for path in root.rglob('*'):\n  if path.is_file():\n   st=path.stat();rows.append((str(path.relative_to(root)),st.st_size,st.st_mtime_ns))\n return hashlib.sha256(json.dumps(sorted(rows)).encode()).hexdigest()\n\ndef disk():\n d=shutil.disk_usage('/');return dict(total=d.total,used=d.used,free=d.free)\n\ndef db_counts():\n sql=\"SELECT json_build_object('users',(SELECT count(*) FROM users),'rep_events',(SELECT count(*) FROM reputation_events),'rep_requests',(SELECT count(*) FROM reputation_requests),'adjustments',(SELECT count(*) FROM reputation_adjustments),'scam_records',(SELECT count(*) FROM scam_records),'trusted',(SELECT count(*) FROM trusted_designations),'admins',(SELECT count(*) FROM administrators),'groups',(SELECT count(*) FROM managed_groups),'reports',(SELECT count(*) FROM reports));\"\n # Local PostgreSQL socket; no passwords or connection strings are displayed.\n cmd=['docker','exec','safecheck-postgres-1','sh','-c','exec psql -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -X -At -v ON_ERROR_STOP=1 -c \"$1\"','sh',sql]\n return json.loads(run(cmd).stdout.strip())\n\nwith open('/var/lib/safecheck/operations.lock','a') as lock:\n fcntl.flock(lock,fcntl.LOCK_EX|fcntl.LOCK_NB)\n before=containers()\n if not before or any(c['status']!='running' for c in before.values()):raise RuntimeError('Containers not running')\n protected={c['image'] for c in before.values()}\n for tag in KEEP_TAGS:\n  image=inspect_image(tag)\n  if image:protected.add(image)\n for path in Path('/var/lib').glob('safecheck*/last-deployment.json'):\n  data=json.loads(path.read_text())\n  for key in ['previous_image','candidate_image']:\n   if data.get(key):\n    image=inspect_image(data[key])\n    if image:protected.add(image)\n candidates=[]\n for item in CANDIDATES:\n  if not re.fullmatch(r'safecheck(?:-ui)?:[A-Za-z0-9_.-]+',item['tag']):raise RuntimeError('Unexpected image tag')\n  actual=inspect_image(item['tag'])\n  if actual is None:continue\n  if actual!=item['id']:raise RuntimeError('Image changed since audit')\n  if actual not in protected:candidates.append(item)\n result={'mode':MODE,'disk_before':disk(),'protected_images':sorted(protected),'remove_images':candidates,'container_names':sorted(before)}\n result['docker_root']=run(['docker','info','--format','{{.DockerRootDir}}']).stdout.strip()\n result['storage_dirs']={}\n for path in ['/var/lib/containerd','/var/lib/docker','/var/log','/var/cache/apt/archives']:\n  if Path(path).exists():result['storage_dirs'][path]=run(['du','-sx','--block-size=1',path]).stdout.strip()\n result['db_before']=db_counts()\n if MODE=='APPLY':\n  backups=manifest('/var/backups/safecheck')\n  volumes=run(['docker','volume','ls','-q']).stdout.split()\n  for item in candidates:\n   fresh=containers()\n   if any(c['image']==item['id'] for c in fresh.values()):raise RuntimeError('Image now used by a container')\n   if inspect_image(item['tag'])!=item['id']:raise RuntimeError('Image tag changed')\n   # No force flag: Docker refuses removal if the image is still required.\n   run(['docker','image','rm',item['tag']],timeout=120)\n  result['removed_image_count']=len(candidates)\n  cache=run(['docker','builder','prune','--all','--force'],timeout=480)\n  result['cache_summary']=[line for line in cache.stdout.splitlines() if 'Total:' in line or 'reclaimed' in line.lower()][-3:]\n  run(['apt-get','clean'])\n  after=containers()\n  if before!=after:raise RuntimeError('Container identity or mounts changed')\n  if volumes!=run(['docker','volume','ls','-q']).stdout.split():raise RuntimeError('Volume list changed')\n  if backups!=manifest('/var/backups/safecheck'):raise RuntimeError('Backup files changed')\n  if any(inspect_image(image)!=image for image in protected):raise RuntimeError('Protected image missing')\n  result['db_after']=db_counts()\n  result['db_counts_preserved']=all(result['db_after'][k]>=v for k,v in result['db_before'].items())\n  if not result['db_counts_preserved']:raise RuntimeError('Database row count decreased')\n  result['containers_preserved']=True;result['volumes_preserved']=True;result['backups_preserved']=True\n  result['docker_df_after']=run(['docker','system','df']).stdout.strip()\n  result['status_after']=run(['docker','ps','--format','{{.Names}}\\t{{.Status}}']).stdout.strip()\n  result['disk_after']=disk();result['freed_bytes']=result['disk_after']['free']-result['disk_before']['free']\n print('DISK_CLEAN='+json.dumps(result))\nPY\n"
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
