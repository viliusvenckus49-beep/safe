name: SAFECheck prepare selected staff login
on:
  push:
    branches: [mtproto-staff-switch-20261009]
    paths: ['.github/workflows/prepare-account-switch.yml']
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Check interactive login helper
        run: pytest -q tests/test_mtproto_login.py && ruff check deploy/mtproto_login.py tests/test_mtproto_login.py && ruff format --check deploy/mtproto_login.py tests/test_mtproto_login.py && python -m py_compile deploy/mtproto_login.py
      - name: Prepare pinned read-only VPS access
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY" && test -n "$HOST" && test -n "$REMOTE_USER"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          ssh-keygen -y -f "$HOME/.ssh/safecheck_deploy" > /dev/null
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
      - name: Upload tested login source and prepare a separate account directory
        env:
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          SSH_OPTIONS=(-i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20)
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/safecheck-account-tools.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "mkdir -p \"\$HOME/safecheck-account-tools/$GITHUB_SHA\""
          scp "${SSH_OPTIONS[@]}" "$RUNNER_TEMP/safecheck-account-tools.tar.gz" "$REMOTE_USER@$HOST:safecheck-account-tools/$GITHUB_SHA/source.tar.gz"
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "tar -xzf \"\$HOME/safecheck-account-tools/$GITHUB_SHA/source.tar.gz\" -C \"\$HOME/safecheck-account-tools/$GITHUB_SHA\""
          ssh "${SSH_OPTIONS[@]}" "$REMOTE_USER@$HOST" "sudo -n python3 - \"\$HOME/safecheck-account-tools/$GITHUB_SHA\"" <<'PY'
          import json,os,stat,subprocess,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          assert root.is_absolute() and (root/'deploy/mtproto-tools.Dockerfile').is_file()
          names=['safecheck-bot-1','safecheck-postgres-1','safecheck-redis-1','safecheck-ui-studio-studio-1']
          def identities():
              return subprocess.run(['docker','inspect','--format','{{.Id}} {{.Image}} {{.State.StartedAt}}',*names],capture_output=True,check=True,text=True).stdout
          before=identities()
          state=Path('/etc/safecheck/mtproto-next')
          if state.exists() or state.is_symlink():
              info=state.lstat()
              assert stat.S_ISDIR(info.st_mode) and info.st_uid==10001 and info.st_gid==10001 and info.st_mode & 0o077==0
              for private in state.iterdir():
                  info=private.lstat()
                  assert stat.S_ISREG(info.st_mode) and info.st_uid==10001 and info.st_gid==10001 and info.st_mode & 0o077==0, 'Existing login state must stay private'
          else:
              state.mkdir(mode=0o700)
              os.chown(state,10001,10001)
          result=subprocess.run(['docker','build','-f',str(root/'deploy/mtproto-tools.Dockerfile'),'-t','safecheck-mtproto-tools:1.42.0-staff-switch',str(root/'deploy')],capture_output=True,timeout=180)
          assert result.returncode==0,'New account login helper build failed'
          code="import ast,json; from pathlib import Path; source=Path('/app/mtproto_login.py').read_text(); tree=ast.parse(source); values={node.targets[0].id:ast.literal_eval(node.value) for node in tree.body if isinstance(node,ast.Assign) and isinstance(node.targets[0],ast.Name) and node.targets[0].id in ('STAFF_CHAT_ID','STAFF_BOT')}; assert 'client.iter_dialogs()' in source and 'dialog.id == staff_id' in source and 'staff_id=options.staff_id' in source and 'staff_bot=options.staff_bot' in source; print(json.dumps(values))"
          probe=subprocess.run(['docker','run','--rm','--read-only','--tmpfs','/tmp','--cap-drop','ALL','--security-opt','no-new-privileges','--entrypoint','python','safecheck-mtproto-tools:1.42.0-staff-switch','-c',code],capture_output=True,check=True,text=True,timeout=30)
          assert json.loads(probe.stdout)=={'STAFF_CHAT_ID':-1004300060813,'STAFF_BOT':'ghStaffBot'}
          help_result=subprocess.run(['docker','run','--rm','--read-only','--tmpfs','/tmp','--cap-drop','ALL','--security-opt','no-new-privileges','safecheck-mtproto-tools:1.42.0-staff-switch','--help'],capture_output=True,check=True,text=True,timeout=30)
          assert '--staff-id STAFF_ID' in help_result.stdout and '--staff-bot STAFF_BOT' in help_result.stdout
          assert identities()==before,'Running services changed during helper preparation'
          health=subprocess.run(['docker','exec','safecheck-bot-1','python','-c','from app.health import snapshot; import json; print(json.dumps(snapshot()))'],capture_output=True,check=True,text=True).stdout
          assert json.loads(health)['healthy']
          print('NEW_ACCOUNT_HELPER_READY=true')
          print('NEW_ACCOUNT_STATE='+str(state))
          print('NEW_ACCOUNT_LOGIN_REQUIRED=true')
          print('NEW_ACCOUNT_EXISTING_SERVICES_UNCHANGED=true')
          print('NEW_ACCOUNT_MAIN_BOT_HEALTHY=true')
          print('NEW_ACCOUNT_STAFF_ID=-1004430959898')
          print('NEW_ACCOUNT_COMMAND=sudo docker run --rm -it --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --mount type=bind,src=/etc/safecheck/mtproto-next,dst=/state safecheck-mtproto-tools:1.42.0-staff-switch --state-dir /state --staff-id -1004430959898 --staff-bot ghStaffBot')
          PY
      - name: Remove runner key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
