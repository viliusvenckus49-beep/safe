name: SAFECheck SCAM diagnostic
on:
  push:
    branches: [scam-ban-diagnosis-2.14.0]
    paths: [.github/workflows/vps-scam-diagnose.yml]
permissions:
  contents: read
concurrency:
  group: safecheck-vps
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only moderation diagnostic
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/safecheck_deploy"
          printf '%s ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHcTVs4rkhSsS2iJypGBA5QFEaFYW/7YuHKRreksNaSb\n' "$HOST" > "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/safecheck_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$REMOTE_USER@$HOST" 'bash -se' <<'REMOTE'
          set -eu
          sudo -n docker inspect safecheck-bot-1 --format 'RunningImage={{.Config.Image}} Health={{if .State.Health}}{{.State.Health.Status}}{{end}} Source={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          sudo -n docker exec -i safecheck-postgres-1 psql -X -v ON_ERROR_STOP=1 -U safecheck -d safecheck -At <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout='5s';
          SELECT json_build_object('kind','target','record_id',s.id,'telegram_id',u.telegram_id,'status',s.status) FROM scam_records s JOIN users u ON s.target_id=u.id WHERE u.telegram_id=8896102663 ORDER BY s.id;
          SELECT json_build_object('kind','ban','chat_id',b.chat_id,'status',b.status,'attempts',b.attempts,'result_type',b.result_type,'completed_at',b.completed_at,'can_restrict',g.can_restrict_members) FROM ban_actions b LEFT JOIN managed_groups g ON g.chat_id=b.chat_id WHERE b.telegram_id=8896102663 ORDER BY b.id DESC LIMIT 24;
          SELECT json_build_object('kind','vilnius','chat_id',chat_id,'title',title,'enabled',enabled,'approved',approved,'can_restrict',can_restrict_members) FROM managed_groups WHERE lower(title) LIKE '%viln%';
          COMMIT;
          SQL
          sudo -n docker logs --since 8h --tail 30000 safecheck-bot-1 2>&1 | python3 -c 'import json,sys,collections;rows=[];counts=collections.Counter()
          for line in sys.stdin:
              try: o=json.loads(line)
              except (ValueError,TypeError): continue
              e=o.get("event")
              if e in ("update_failed","group_worker_failed","error_response_failed") or (e in ("group_ban_result","scam_ban_processing_deferred","operation_rejected") and o.get("user_id")==8896102663):
                  fields=("event","timestamp","operation","chat_id","user_id","scam_record_id","success","pending","result","error_type","reason","exception_type","error_code")
                  row={k:o[k] for k in fields if k in o};rows.append(row);counts[str(row.get("reason") or row.get("exception_type") or row.get("result"))]+=1
          print("DiagnosticCounts="+json.dumps(dict(counts),ensure_ascii=False))
          for row in rows[-50:]:print("DiagnosticEvent="+json.dumps(row,ensure_ascii=False))'
          sudo -n docker logs --since 8h --tail 15000 safecheck-postgres-1 2>&1 | python3 -c 'import sys,re;counts={}
          for line in sys.stdin:
              if "ERROR:" not in line:continue
              reason=line.split("ERROR:",1)[1].strip()
              reason=re.sub(r"\"[^\"]*\"", "[redacted]", reason)
              reason=reason.split("DETAIL:",1)[0][:180]
              if reason.startswith(("operator does not exist", "could not", "deadlock", "invalid input", "null value", "duplicate key", "value too long", "column", "relation", "syntax error", "current transaction", "cannot")):counts[reason]=counts.get(reason,0)+1
          print("DatabaseErrorCounts="+str(counts))'
          sudo -n docker exec -i safecheck-bot-1 python /run/configs/secret_entrypoint.py python - <<'PY'
          import asyncio
          from sqlalchemy import select, text, cast, BigInteger
          from app.config import Settings
          from app.db import create_database
          from app.models import AuditEvent
          async def run():
              engine,sessions=create_database(Settings().database_url)
              for fixed in (False, True):
                  async with sessions() as session:
                      await session.execute(text("SET TRANSACTION READ ONLY"))
                      expr=cast(AuditEvent.details["chat_id"].as_string(),BigInteger) if fixed else AuditEvent.details["chat_id"].as_integer()
                      try:
                          await session.scalar(select(AuditEvent.id).where(expr==-1003976343267).limit(1))
                          print("RetryQueryFixed="+str(fixed)+" Result=OK")
                      except Exception as error:
                          reason=str(getattr(error,"orig",""))
                          category="int32_overflow" if ("out of int32 range" in reason or "integer out of range" in reason) else type(error).__name__
                          print("RetryQueryFixed="+str(fixed)+" Result="+category)
                      await session.rollback()
              await engine.dispose()
          asyncio.run(run())
          PY
          REMOTE
      - name: Remove key
        if: always()
        run: rm -f "$HOME/.ssh/safecheck_deploy"
